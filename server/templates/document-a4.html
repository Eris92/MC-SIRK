<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <style>
    :root {
      --ink: #0f172a;
      --muted: #64748b;
      --line: #b8d8c2;
      --soft: #f6fbf7;
      --accent: #19833e;
      --accent-dark: #11632e;
      --accent-soft: #e5f4ea;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 18px;
      font-family: "Segoe UI", Arial, sans-serif;
      color: var(--ink);
      background: #ffffff;
    }
    .page {
      max-width: 210mm;
      min-height: calc(297mm - 36px);
      margin: 0 auto;
    }
    .toolbar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 12px;
    }
    .toolbar button {
      border: 1px solid var(--accent-dark);
      background: var(--accent);
      color: #ffffff;
      border-radius: 8px;
      padding: 8px 14px;
      cursor: pointer;
      font-size: 14px;
    }
    .header {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      padding-bottom: 14px;
      border-bottom: 2px solid var(--accent);
      margin-bottom: 14px;
    }
    .brand-logo {
      display: block;
      width: 190px;
      max-width: 42vw;
      height: auto;
      object-fit: contain;
    }
    .brand-fallback {
      width: 190px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      background: #111827;
      color: #ffffff;
      font-weight: 700;
      letter-spacing: 0.08em;
    }
    .title {
      font-size: 26px;
      line-height: 1.2;
      margin: 0;
      color: #000000;
    }
    .meta {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px 12px;
      margin: 16px 0 18px;
      font-size: 12px;
    }
    .meta div {
      padding: 9px 11px;
      border: 1px solid var(--line);
      background: var(--soft);
      border-radius: 8px;
      overflow-wrap: anywhere;
    }
    .section { margin-top: 18px; }
    .section h2 {
      margin: 0 0 8px;
      font-size: 15px;
      color: var(--accent);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 12px;
    }
    th, td {
      border: 1px solid var(--line);
      padding: 9px 10px;
      vertical-align: top;
      word-wrap: break-word;
      overflow-wrap: anywhere;
    }
    th {
      background: var(--accent-soft);
      text-align: left;
    }
    .people {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 18px;
      font-size: 12px;
    }
    .person {
      min-height: 54px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--soft);
    }
    .person span {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 11px;
    }
    .signatures {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 26px;
      margin-top: 72px;
    }
    .signature {
      min-height: 72px;
      border-top: 1px solid #000000;
      padding-top: 8px;
      font-size: 12px;
    }
    .note {
      margin-top: 18px;
      color: #b91c1c;
      font-size: 14px;
      line-height: 1.45;
      font-weight: 700;
    }
    @media print {
      @page { size: A4; margin: 10mm; }
      html, body { margin: 0; padding: 0; }
      body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .toolbar { display: none; }
      .page { max-width: none; min-height: auto; }
      .signatures { margin-top: 32px; }
      .note { margin-top: 12px; }
    }
  </style>
  <script>function printProtocol() { window.print(); }</script>
</head>
<body>
  <div class="page">
    <div class="toolbar"><button type="button" onclick="printProtocol()">Drukuj</button></div>
    <div class="header">
      {{LOGO_MARKUP}}
      <div><h1 class="title">{{TITLE}}</h1></div>
    </div>
    {{DOCUMENT_BODY}}
  </div>
</body>
</html>
