name: Issue 265 Finalize

on:
  push:
    branches:
      - issue-265-move-execution

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: issue-265-move-execution
      - name: Apply dev46 metadata
        run: python scripts/issue-265-finalize.py
      - name: Remove branch-only finalizer before validation
        run: git rm -f scripts/issue-265-finalize.py .github/workflows/issue-265-finalize.yml
      - name: Validate clean candidate
        run: |
          node test/move-request-execution.test.js
          node test/move-request-single-pending.test.js
          node scripts/validate-repository-layout.js
          git diff --check
      - name: Commit clean candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: bump development revision to 0.1.1-dev.46"
          git push origin HEAD:issue-265-move-execution
