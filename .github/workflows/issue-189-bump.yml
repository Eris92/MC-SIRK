name: Validate dev.16 metadata bump

on:
  push:
    branches:
      - issue-189-version-dev16
    paths:
      - '.github/workflows/issue-189-bump.yml'

permissions:
  contents: write

jobs:
  bump-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Prepare metadata
        run: python3 scripts/tmp-issue-189-bump.py
      - name: Targeted repository metadata validation
        run: node scripts/validate-repository-layout.js
      - name: Full test suite
        run: npm test
      - name: Diff check
        run: git diff --check
      - name: Commit validated bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: bump development revision to 0.1.1-dev.16"
          git push origin HEAD:issue-189-version-dev16
