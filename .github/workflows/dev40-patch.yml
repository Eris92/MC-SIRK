name: Dev40 Gate
on:
  push:
    branches:
      - dev-40-network-admin-root-cause
permissions:
  contents: write
jobs:
  gate:
    if: ${{ !contains(github.event.head_commit.message, '[dev40 clean]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev-40-network-admin-root-cause
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node test/network-command-split.test.js
      - run: node test/logged-on-user-command-policy.test.js
      - run: node test/admin-host-theme-signal.test.js
      - run: rm -f scripts/dev40-patch.js .dev40-trigger .github/workflows/dev40-patch.yml
      - run: npm test
      - run: git diff --check
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: remove dev40 patch infrastructure [dev40 clean]"
          git push origin HEAD:dev-40-network-admin-root-cause
