name: Agent 125 127

on:
  push:
    branches: [issues-125-127-ui]
    paths:
      - '.github/workflows/agent-125-127.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: issues-125-127-ui
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Apply targeted patches
        run: python3 .github/agent_125_127.py
      - name: Syntax and targeted tests
        run: |
          node --check public/shared/ui/toolbar-config.js
          node --check public/modules/move-requests/index.js
          node test/results-view-button-variant.test.js
          node test/move-request-submit-feedback.test.js
          node test/button-style-contract.test.js
          node test/semantic-visual-contract.test.js
          node test/native-mesh-theme-contract.test.js
          node test/current-device-node-context.test.js
          node test/native-ui-contract.test.js
      - name: Commit verified batch
        run: |
          rm .github/agent_125_127.py .github/workflows/agent-125-127.yml
          git config user.name "Eris92"
          git config user.email "43513086+Eris92@users.noreply.github.com"
          git add public/shared/ui/toolbar-config.js public/modules/move-requests/index.js test .github/agent_125_127.py .github/workflows/agent-125-127.yml
          git commit -m "fix: preserve Results View and Move Request feedback surfaces"
          git push origin HEAD:issues-125-127-ui
