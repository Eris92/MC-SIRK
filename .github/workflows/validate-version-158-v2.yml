name: Validate version 158 v2

on:
  push:
    branches:
      - issue-158-version-bump
    paths:
      - .github/workflows/validate-version-158-v2.yml

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: issue-158-version-bump
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Apply metadata
        run: |
          python scripts/tmp-version-158.py
          rm scripts/tmp-version-158.py
          rm .github/workflows/validate-version-158.yml
          rm .github/workflows/validate-version-158-v2.yml
      - name: Validate metadata
        run: node scripts/validate-repository-layout.js
      - name: Test
        run: npm test
      - name: Diff check
        run: |
          git diff --check
          git status --short
      - name: Save
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs: synchronize 0.1.1-dev.7 metadata"
          git push origin HEAD:issue-158-version-bump
