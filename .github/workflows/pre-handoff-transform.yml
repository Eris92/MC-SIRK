name: Apply pre-handoff transform

on:
  push:
    branches:
      - refactor/pre-handoff-cleanup-1.8.20
    paths:
      - scripts/pre-handoff-transform.py
      - .github/workflows/pre-handoff-transform.yml

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/pre-handoff-cleanup-1.8.20
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply transform
        run: python scripts/pre-handoff-transform.py
      - name: Validate transformed sources
        run: |
          node --check public/native/desktop-commands.js
          node --check public/shared/runtime.js
          ! grep -R "setInterval(" public --include='*.js'
          ! grep -R "new MutationObserver" public/native/desktop-commands.js
      - name: Remove one-shot tooling and commit
        run: |
          rm scripts/pre-handoff-transform.py
          rm .github/workflows/pre-handoff-transform.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Remove Quick polling and duplicate device routing"
          git push origin HEAD:refactor/pre-handoff-cleanup-1.8.20
