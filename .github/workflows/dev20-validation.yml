name: Dev20 validation
on:
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node test/move-request-dialog-surface.test.js
      - run: node test/move-request-submit-feedback.test.js
      - run: npm test
      - run: git diff --check origin/main...HEAD
