name: Dev22 metadata finalize

on:
  push:
    branches:
      - issue-214-dev22

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: issue-214-dev22
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Synchronize development metadata
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          old = '0.1.1-dev.21'
          new = '0.1.1-dev.22'

          p = Path('README.md')
          text = p.read_text()
          text = text.replace('# SIRK Management Platform ' + old, '# SIRK Management Platform ' + new, 1)
          text = text.replace('docs/releases/' + old + '.md', 'docs/releases/' + new + '.md', 1)
          p.write_text(text)

          p = Path('docs/PROJECT-STATE.md')
          text = p.read_text()
          text = text.replace('Current version: `' + old + '`', 'Current version: `' + new + '`', 1)
          text = text.replace('package.json -> ' + old, 'package.json -> ' + new, 1)
          text = text.replace('config.json  -> ' + old, 'config.json  -> ' + new, 1)
          text = text.replace('Aktualne development notes: `docs/releases/' + old + '.md`.', 'Aktualne development notes: `docs/releases/' + new + '.md`.', 1)
          p.write_text(text)

          p = Path('changelog.md')
          text = p.read_text()
          block = '''## 0.1.1-dev.22 - 2026-08-08

- Deliver the shared startup/readiness fix from PR #212 for Issues #177 and #178.
- Mount enabled+allowed SIRK native menu entries immediately after bootstrap instead of waiting for renderer/module initialization.
- Fetch deferred shared UI assets concurrently and initialize allowed modules in one bounded parallel fan-out, while retaining and replaying pre-runtime native page/device context.
- Keep one canonical startup/menu owner with no polling, MutationObserver, readiness timer staircase, tag or GitHub Release.

Current development notes: `docs/releases/0.1.1-dev.22.md`.

'''
          if not text.startswith('## 0.1.1-dev.22'):
              p.write_text(block + text)

          p = Path('docs/releases/README.md')
          text = p.read_text()
          marker = 'Aktualna linia development:\n\n'
          new_line = '- [`0.1.1-dev.22`](0.1.1-dev.22.md) — bieżąca rewizja development z wcześniejszym permission-safe bootstrap menu, równoległym bounded startupem rendererów i replay natywnego node/page contextu;\n'
          old_line = '- [`0.1.1-dev.21`](0.1.1-dev.21.md) — bieżąca rewizja development z usuniętym Move Request host-button readiness retry staircase i synchronicznym reuse natywnych lifecycle callbacks;\n'
          prev_line = '- [`0.1.1-dev.21`](0.1.1-dev.21.md) — poprzednia rewizja development z usuniętym Move Request host-button readiness retry staircase i synchronicznym reuse natywnych lifecycle callbacks;\n'
          text = text.replace(old_line, prev_line, 1)
          if new_line not in text:
              text = text.replace(marker, marker + new_line, 1)
          p.write_text(text)

          p = Path('version-history.json')
          history = json.loads(p.read_text())
          if not history or history[0].get('version') != new:
              history.insert(0, {
                  'version': new,
                  'date': '2026-08-08',
                  'changes': [
                      'Bump the pre-1.0 development revision so MeshCentral update detection installs the shared startup/readiness fix from PR #212.',
                      'Mount enabled and allowed SIRK native menu entries immediately after bootstrap instead of waiting for renderer initialization.',
                      'Load deferred shared UI assets concurrently and initialize allowed modules in a bounded parallel fan-out while replaying captured native page and device context.',
                      'Keep one canonical startup/menu owner without polling, MutationObserver, readiness timer staircases, tag or GitHub Release.'
                  ]
              })
          p.write_text(json.dumps(history, indent=2, ensure_ascii=False) + '\n')

          Path('docs/releases/0.1.1-dev.22.md').write_text('''# MC-SIRK 0.1.1-dev.22

Status: development pre-1.0. No tag or GitHub Release.

## Runtime included

- PR #212 / commit `5b5381fd0e1a25cb79692041d5c8ca6b55dfd599`: startup/readiness fix for Issues #177 and #178.
- Browser startup uses a small bootstrap-critical phase, then loads deferred shared UI assets concurrently.
- `runtime.prepare()` mounts enabled+allowed native SIRK menus from bootstrap before renderer initialization, reusing `core.ensureMenu()`.
- Enabled+allowed module scripts initialize in one bounded parallel fan-out instead of a serial chain.
- Native page/device context that arrives before runtime/module load is retained and replayed after module initialization.
- No polling, MutationObserver, timer staircase or second menu renderer.

## Verification

- Targeted regression: `test/startup-menu-readiness.test.js`.
- Updated Quick isolation regression: `test/quick-lifecycle-isolation.test.js`.
- Canonical PR #212 `npm test`: GREEN, run `31264073568`.
- Real MeshCentral hard-refresh/navigation smoke remains required for Issues #177 and #178.

## Versioning

- Development revision only: `0.1.1-dev.21` -> `0.1.1-dev.22`.
- Version remains below `1.0.0`.
- No tag or GitHub Release.
''')
          PY
          rm -f .github/workflows/dev22-bump.yml
          node -e "const p=require('./package.json');const c=require('./config.json');if(p.version!=='0.1.1-dev.22'||c.version!==p.version)process.exit(1)"
          npm test
          git diff --check
      - name: Commit finalized metadata
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: finalize 0.1.1-dev.22 metadata"
          git push origin HEAD:issue-214-dev22
