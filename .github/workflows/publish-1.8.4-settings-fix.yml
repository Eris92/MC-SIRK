name: Publish 1.8.4 settings fix
on:
  pull_request:
permissions:
  contents: write
jobs:
  publish:
    if: github.head_ref == 'trigger/publish-1.8.4-settings-fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fix channel persistence and Settings navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manager = Path('server/system-update-manager.js')
          text = manager.read_text(encoding='utf-8')
          text = text.replace('        if (state.pending) throw new Error("The update channel cannot be changed while an operation is pending.");\n', '')
          manager.write_text(text, encoding='utf-8')

          updates = Path('public/portal/system-updates.js')
          text = updates.read_text(encoding='utf-8')
          text = text.replace("(busy(snapshot) || current.pending ? ' disabled' : '') + '>Zapisz</button>", "(busy(snapshot) ? ' disabled' : '') + '>Zapisz</button>")
          text = text.replace("api(\"channel\", \"POST\", { channel: channel.value }).then(function () { return load(host, section); }).catch(function (error) { window.alert(error.message); });", "actionNode.disabled = true; api(\"channel\", \"POST\", { channel: channel.value }).then(function (saved) { state.snapshot.current = saved; return load(host, section); }).then(function () { window.alert(\"Kanał aktualizacji został zapisany.\"); }).catch(function (error) { window.alert(error.message); }).then(function () { actionNode.disabled = false; });")

          start = text.index('    function settingsLayout(host) {')
          end = text.index('    function installSettingsIntegration() {', start)
          replacement = '''    function settingsLayout(host) {
              if (!host || host.getAttribute("data-system-settings-ready") === "1") return;
              host.setAttribute("data-system-settings-ready", "1");

              var original = document.createElement("div");
              original.className = "sirk-settings-original";
              while (host.firstChild) original.appendChild(host.firstChild);

              var shell = document.createElement("section");
              shell.className = "sirk-standalone-view-scroll";
              shell.innerHTML = '<div class="sirk-toolbar-host"><div class="sirk-toolbar"><strong>Ustawienia</strong></div></div>' +
                  '<div class="sirk-layout-host"><div class="sirk-layout"><aside class="sirk-column-primary">' +
                  '<button type="button" class="sirk-nav-item is-active" data-settings-group="overview">Overview</button>' +
                  '<button type="button" class="sirk-nav-item" data-settings-group="settings">Settings</button>' +
                  '<button type="button" class="sirk-nav-item" data-settings-group="plugins">Wtyczki</button>' +
                  '<button type="button" class="sirk-nav-item" data-settings-group="server">Serwer</button>' +
                  '<button type="button" class="sirk-nav-item" data-settings-group="debug">Debug</button>' +
                  '<button type="button" class="sirk-nav-item" data-settings-group="system">System</button></aside>' +
                  '<aside class="sirk-column-secondary" data-settings-secondary></aside>' +
                  '<div class="sirk-column-details" data-settings-details></div></div></div>';
              host.appendChild(shell);

              var secondary = shell.querySelector("[data-settings-secondary]");
              var details = shell.querySelector("[data-settings-details]");

              function activateLegacyTab(group) {
                  details.appendChild(original);
                  var frame = original.querySelector("iframe");
                  function select() {
                      try {
                          var button = frame && frame.contentDocument && frame.contentDocument.querySelector('[data-tab="' + group + '"]');
                          if (button) button.click();
                      } catch (error) {}
                  }
                  if (frame) {
                      frame.addEventListener("load", select, { once: true });
                      select();
                  }
              }

              function selectGroup(group) {
                  Array.prototype.forEach.call(shell.querySelectorAll("[data-settings-group]"), function (item) {
                      item.classList.toggle("is-active", item.getAttribute("data-settings-group") === group);
                  });
                  secondary.innerHTML = "";
                  details.innerHTML = "";
                  if (group === "system") {
                      secondary.innerHTML = '<button type="button" class="sirk-nav-item is-active" data-system-section="updates">Aktualizacje</button>' +
                          '<button type="button" class="sirk-nav-item" data-system-section="backups">Backupy</button>' +
                          '<button type="button" class="sirk-nav-item" data-system-section="history">Historia</button>' +
                          '<button type="button" class="sirk-nav-item" data-system-section="channel">Kanał aktualizacji</button>';
                      mount(details, "updates");
                  } else {
                      activateLegacyTab(group);
                  }
              }

              shell.addEventListener("click", function (event) {
                  var group = event.target.closest("[data-settings-group]");
                  if (group) {
                      selectGroup(group.getAttribute("data-settings-group"));
                      return;
                  }
                  var button = event.target.closest("[data-system-section]");
                  if (!button) return;
                  Array.prototype.forEach.call(shell.querySelectorAll("[data-system-section]"), function (item) {
                      item.classList.toggle("is-active", item === button);
                  });
                  mount(details, button.getAttribute("data-system-section"));
              });

              selectGroup("overview");
          }

'''
          updates.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY
      - name: Set Stable 1.8.4 metadata
        run: |
          node - <<'NODE'
          const fs = require('fs');
          for (const file of ['config.json', 'package.json']) {
            const data = JSON.parse(fs.readFileSync(file, 'utf8'));
            data.version = '1.8.4';
            if (file === 'config.json') {
              data.changelogUrl = 'https://raw.githubusercontent.com/Eris92/SIRK-Portal/main/changelog.md';
              data.configUrl = 'https://raw.githubusercontent.com/Eris92/SIRK-Portal/main/config.json';
              data.downloadUrl = 'https://codeload.github.com/Eris92/SIRK-Portal/zip/refs/heads/main';
              data.versionHistoryUrl = 'https://raw.githubusercontent.com/Eris92/SIRK-Portal/main/version-history.json';
            }
            fs.writeFileSync(file, JSON.stringify(data, null, 2) + '\n');
          }
          const history = JSON.parse(fs.readFileSync('version-history.json', 'utf8'));
          if (!history.some(x => x.version === '1.8.4')) history.unshift({version:'1.8.4',date:'2026-07-27',changes:['Fix saving the update channel','Restore Overview, Settings, Plugins, Server and Debug beside System','Keep legacy admin GUI isolated in its iframe with no shared styles']});
          fs.writeFileSync('version-history.json', JSON.stringify(history, null, 2) + '\n');
          let changelog = fs.readFileSync('changelog.md', 'utf8');
          if (!changelog.startsWith('## 1.8.4')) changelog = '## 1.8.4\n\n- Fixed saving and changing the update channel.\n- Restored Overview, Settings, Wtyczki, Serwer and Debug beside System.\n- Kept the legacy admin GUI isolated in its own iframe and styles.\n\n' + changelog;
          fs.writeFileSync('changelog.md', changelog);
          NODE
      - name: Validate
        run: |
          node --check public/portal/system-updates.js
          node --check server/system-update-manager.js
          node --check web/admin/admin.js
      - name: Publish main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(settings): restore legacy sections and channel save in 1.8.4"
          git push origin HEAD:main
