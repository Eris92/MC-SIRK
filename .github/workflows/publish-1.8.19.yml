name: Publish SIRK 1.8.19

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_run:
    workflows:
      - Test
    types:
      - completed
  schedule:
    - cron: '*/5 * * * *'
  issues:
    types:
      - opened

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: publish-sirk-1.8.19-v5
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name == 'schedule' || github.event.issue.title == 'Publish SIRK 1.8.19' || github.event.pull_request.head.ref == 'publish/1.8.19-final' || github.event.pull_request.head.ref == 'fix/ui-admin-audit-1.8.19' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'fix/ui-admin-audit-1.8.19')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fetch verified patch payload
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin fix/ui-admin-audit-1.8.19
          mapfile -t patch_files < <(git ls-tree -r --name-only origin/fix/ui-admin-audit-1.8.19 | grep '^scripts/patches/apply-1\.8\.19\.part[0-9][0-9]$' | sort)
          test "${#patch_files[@]}" -eq 10
          git checkout origin/fix/ui-admin-audit-1.8.19 -- "${patch_files[@]}"

      - name: Apply atomic source patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import subprocess
          import sys
          import zlib

          parts = sorted(Path('scripts/patches').glob('apply-1.8.19.part[0-9][0-9]'))
          if len(parts) != 10:
              raise SystemExit(f'Expected 10 patch parts, got {len(parts)}')
          payload = ''.join(path.read_text(encoding='utf-8').strip() for path in parts)
          expected = '396668bc86fff78eec27390f79121f4853d8fc9d6753f6c2c70cb0a1e4d0010c'
          actual = hashlib.sha256(payload.encode('ascii')).hexdigest()
          if actual != expected:
              raise SystemExit(f'Patch SHA256 mismatch: {actual}')
          source = zlib.decompress(base64.b64decode(payload))
          target = Path('/tmp/apply-sirk-1.8.19.py')
          target.write_bytes(source)
          subprocess.check_call([sys.executable, str(target)])
          PY

      - name: Validate release tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "1.8.19"
          test "$(node -p "require('./config.json').version")" = "1.8.19"
          git diff --check
          node --check web/admin/admin.js
          node --check server/core/audit-log.js
          node --check server/core/runtime.js
          node --check server/core/device-service.js
          node --check server/modules/commands/index.js
          node --check public/shared/runtime.js
          node --check public/shared/ui/page.js
          node --check public/shared/ui/status-nav.js
          node --check public/shared/ui/tree.js
          node --check public/modules/commands/index.js
          node --check public/native/desktop-commands.js
          node --check admin.js
          node --check test/audit-log.test.js
          node --check test/commands-multi-builtins.test.js
          node --check test/ui-regression-1.8.19.test.js

      - name: Run full test suite
        run: npm test

      - name: Commit clean 1.8.19 release
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/patches/apply-1.8.19.part[0-9][0-9]
          rm -f scripts/patches/publish-trigger-1.8.19.txt
          rm -f .github/workflows/apply-ui-admin-audit-1.8.19.yml
          rm -f .github/workflows/finalize-1.8.19.yml
          rm -f .github/workflows/publish-1.8.19.yml
          rm -f .github/workflows/publish-final-1.8.19.yml
          rm -f tmp.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Release SIRK Management Platform 1.8.19"
          git push origin HEAD:main

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git tag -a v1.8.19 -m "SIRK Management Platform 1.8.19"
          git push origin v1.8.19
          gh release create v1.8.19 --repo "$GITHUB_REPOSITORY" --title "SIRK Management Platform 1.8.19" --notes-file docs/releases/1.8.19.md --latest

      - name: Close trigger
        if: github.event_name == 'issues' || github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "issues" ]; then
            gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --comment "SIRK Management Platform 1.8.19 został opublikowany."
          else
            gh pr close "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --comment "SIRK Management Platform 1.8.19 został opublikowany bezpośrednio do main."
          fi
