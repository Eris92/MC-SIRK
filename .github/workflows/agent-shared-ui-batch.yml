name: Agent shared UI batch

on:
  push:
    branches: [issues-115-120-shared-ui]
    paths:
      - '.github/workflows/agent-shared-ui-batch.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: issues-115-120-shared-ui
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Apply targeted patches
        run: python3 .github/agent_shared_ui_batch.py
      - name: Align semantic tone test with Commands owner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('test/quick-semantic-icon-tone.test.js')
          text = p.read_text()
          old = '''assert.ok(commands.indexOf('"sirk-command-icon-" + tone') >= 0, "My Commands must remain the direct consumer of the same shared tone classes.");'''
          new = '''assert.ok(commands.indexOf('function tonedIcon(markup, tone)') >= 0 && commands.indexOf('iconMarkup: tonedIcon(') >= 0, "My Commands must remain the direct consumer of the same shared tone classes.");'''
          if old not in text:
              raise SystemExit('Expected generated Commands tone assertion not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Syntax and targeted tests
        run: |
          node --check public/shared/ui/catalog.js
          node --check public/shared/ui/toolbar-config.js
          node --check public/native/desktop-commands.js
          node test/shared-catalog-direct-columns.test.js
          node test/shared-list-quick-style.test.js
          node test/edit-live-geometry.test.js
          node test/button-style-contract.test.js
          node test/quick-commands-compact-layout.test.js
          node test/quick-toolbar-order.test.js
          node test/quick-collapse-action-icon.test.js
          node test/quick-toolbar-nowrap.test.js
          node test/quick-output-attention-precedence.test.js
          node test/quick-shared-selection-style.test.js
          node test/semantic-visual-contract.test.js
          node test/quick-semantic-icon-tone.test.js
      - name: Commit verified batch
        run: |
          rm .github/agent_shared_ui_batch.py .github/workflows/agent-shared-ui-batch.yml
          git config user.name "Eris92"
          git config user.email "43513086+Eris92@users.noreply.github.com"
          git add public/native/desktop-commands.js test .github/agent_shared_ui_batch.py .github/workflows/agent-shared-ui-batch.yml
          git commit -m "test: cover shared UI and Quick issue batch"
          git push origin HEAD:issues-115-120-shared-ui
