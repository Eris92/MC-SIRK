name: Fix173 Temp
on:
  push:
    branches: [fix/173-native-dialog-manager]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/173-native-dialog-manager
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply native dialog-manager migration
        run: node scripts/tmp-fix173-native-dialog.js
      - name: Remove temporary validation files
        run: rm -f scripts/tmp-fix173-native-dialog.js .github/workflows/fix173-temp.yml
      - name: Targeted Move Request tests
        run: |
          node test/move-request-dialog-surface.test.js
          node test/move-request-submit-feedback.test.js
      - name: Full test suite
        run: npm test
      - name: Diff check
        run: git diff --check
      - name: Commit validated runtime patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(move-requests): use native MeshCentral dialog manager"
          git push origin HEAD:fix/173-native-dialog-manager
