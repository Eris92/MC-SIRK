name: Validate action mode geometry 116 v4

on:
  push:
    branches: [fix-action-mode-text-116]
    paths:
      - '.github/workflows/validate-action-mode-116-v4.yml'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: fix-action-mode-text-116
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Apply final shared action-mode patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/validate-action-mode-116.yml').read_text()
          script = workflow.split("python - <<'PY'\n", 1)[1].split('\n          PY', 1)[0]
          exec(compile(textwrap.dedent(script), 'action-mode-patch.py', 'exec'), {})

          path = Path('test/edit-toggle-atomic.test.js')
          text = path.read_text()
          old = '    assert.strictEqual(active.multi, false, "Edit must still clear multi mode immediately.");'
          new = '''    assert.strictEqual(tool.state.multiPickMode, false,\n        "Edit must clear the Multi state before staging the new tree.");\n    assert.strictEqual(active.multi, undefined,\n        "Edit must not mutate live Multi geometry before the atomic render commits.");'''
          if old not in text: raise SystemExit('stale Edit/Multi assertion not found')
          path.write_text(text.replace(old, new, 1))

          path = Path('test/ui-visible-state-regression.test.js')
          text = path.read_text()
          old = '''var editStart = tools.indexOf("if (state.editMode) {");\nvar editEnd = tools.indexOf("if (state.multiPickMode", editStart);'''
          new = '''var actionsStart = tools.indexOf("scriptActions: function (script, config)");\nassert.ok(actionsStart >= 0, "Shared scriptActions owner must remain present.");\nvar editStart = tools.indexOf("if (state.editMode) {", actionsStart);\nvar editEnd = tools.indexOf("if (state.multiPickMode", editStart);'''
          if old not in text: raise SystemExit('ui-visible broad Edit anchor not found')
          path.write_text(text.replace(old, new, 1))

          path = Path('test/workspace-page-style.test.js')
          text = path.read_text()
          old = '''assert.ok(\n    toolbar.indexOf(".mc-shared-page.is-edit-mode .mc-shared-layout{grid-template-columns:") >= 0 &&\n    toolbar.indexOf(".mc-shared-page.is-multi-mode .mc-shared-layout{grid-template-columns:") >= 0,\n    "Toolbar CSS may own only explicit Edit/Multi layout exceptions needed for their measured mode geometry."\n);'''
          new = '''assert.ok(\n    toolbar.indexOf(".mc-shared-page:is(.is-edit-mode,.is-multi-mode) .mc-shared-layout{grid-template-columns:") >= 0 &&\n    toolbar.indexOf(".mc-shared-page:is(.is-edit-mode,.is-multi-mode) .mc-shared-layout.is-collapsed{grid-template-columns:") >= 0,\n    "Toolbar CSS may own one shared Edit/Multi layout exception for measured external action geometry."\n);'''
          if old not in text: raise SystemExit('workspace-page-style old action-mode whitelist not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/validate-action-mode-116.yml
          rm .github/workflows/validate-action-mode-116-v2.yml
          rm .github/workflows/validate-action-mode-116-v3.yml
          rm .github/workflows/validate-action-mode-116-v4.yml
      - name: Targeted action-mode regression
        run: |
          node test/edit-live-geometry.test.js
          node test/edit-toggle-atomic.test.js
          node test/script-mode-layout.test.js
          node test/tree-single-action-container.test.js
          node test/button-style-contract.test.js
          node test/ui-visible-state-regression.test.js
          node test/workspace-page-style.test.js
      - name: Run full test suite
        run: npm test
      - name: Check final diff
        run: |
          git diff --check
          git status --short
      - name: Save verified fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: keep action mode text geometry stable"
          git push origin HEAD:fix-action-mode-text-116
