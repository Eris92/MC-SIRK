name: Apply SIRK 1.8.19 patch

on:
  push:
    branches:
      - fix/ui-admin-audit-1.8.19
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/ui-admin-audit-1.8.19
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import zlib
          payload = Path('scripts/patches/apply-1.8.19.py.b64').read_text(encoding='utf-8').strip()
          Path('/tmp/apply_patch.py').write_bytes(zlib.decompress(base64.b64decode(payload)))
          PY
          python /tmp/apply_patch.py
      - name: Run full test suite
        run: npm test
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix UI admin actions and audit logging for 1.8.19"
          git push origin HEAD:fix/ui-admin-audit-1.8.19

