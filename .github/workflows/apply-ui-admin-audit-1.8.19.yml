name: Apply SIRK 1.8.19 patch

on:
  push:
    branches:
      - fix/ui-admin-audit-1.8.19

permissions:
  contents: write

concurrency:
  group: sirk-1.8.19-final
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current branch head
        uses: actions/checkout@v4
        with:
          ref: fix/ui-admin-audit-1.8.19
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Rebuild and verify patch payload
        shell: pwsh
        run: |
          $code = @'
          from pathlib import Path
          import base64
          import hashlib
          import os
          import zlib

          parts = sorted(Path('scripts/patches').glob('apply-1.8.19.part*'))
          if len(parts) != 10:
              raise RuntimeError(f'Expected 10 patch parts, got {len(parts)}')
          payload = ''.join(path.read_text(encoding='utf-8').strip() for path in parts)
          if len(payload) != 16608:
              raise RuntimeError(f'Unexpected patch payload length: {len(payload)}')
          expected = '396668bc86fff78eec27390f79121f4853d8fc9d6753f6c2c70cb0a1e4d0010'
          actual = hashlib.sha256(payload.encode('ascii')).hexdigest()
          if actual != expected:
              raise RuntimeError(f'Patch payload SHA256 mismatch: {actual}')
          source = zlib.decompress(base64.b64decode(payload))
          target = Path(os.environ['RUNNER_TEMP']) / 'apply-1.8.19.py'
          target.write_bytes(source)
          print(f'Patch payload OK: {actual}; source bytes: {len(source)}')
          '@
          $code | python -
          python "$env:RUNNER_TEMP\apply-1.8.19.py"
      - name: Validate changed JavaScript
        shell: pwsh
        run: |
          git diff --check
          node --check web/admin/admin.js
          node --check server/core/audit-log.js
          node --check server/core/runtime.js
          node --check server/core/device-service.js
          node --check server/modules/commands/index.js
          node --check public/shared/runtime.js
          node --check public/shared/ui/page.js
          node --check public/shared/ui/status-nav.js
          node --check public/shared/ui/tree.js
          node --check public/modules/commands/index.js
          node --check public/native/desktop-commands.js
          node --check admin.js
          node --check test/audit-log.test.js
          node --check test/commands-multi-builtins.test.js
          node --check test/ui-regression-1.8.19.test.js
      - name: Run full test suite
        shell: pwsh
        run: npm test
      - name: Commit verified source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix UI admin actions and audit logging for 1.8.19"
          git push origin HEAD:fix/ui-admin-audit-1.8.19

# Retry after GitHub Actions recovery.
