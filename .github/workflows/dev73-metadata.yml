name: Dev73 Metadata Sync

on:
  push:
    branches:
      - fix/jira-assets-user-object-bridge

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Sync dev73 metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          changelog = Path('changelog.md')
          text = changelog.read_text(encoding='utf-8')
          block = '''## 0.1.1-dev.73 - 2026-08-12\n\n- Resolve Jira equipment assigned through workspace Users/person identity objects by deriving the selected user's object id/key/label aliases from the existing bounded Assets snapshot.\n- Preserve direct Jira user references, exclude the identity object itself, and keep unrelated plain-text matching constrained.\n\nCurrent development notes: `docs/releases/0.1.1-dev.73.md`.\n\n'''
          if not text.startswith('## 0.1.1-dev.73'):
              changelog.write_text(block + text, encoding='utf-8')

          release_index = Path('docs/releases/README.md')
          text = release_index.read_text(encoding='utf-8')
          marker = 'Aktualna linia development:\n\n'
          line = '- [`0.1.1-dev.73`](0.1.1-dev.73.md) — resolve Jira equipment through workspace Users/person identity objects;\n'
          if line not in text:
              text = text.replace(marker, marker + line, 1)
              release_index.write_text(text, encoding='utf-8')

          history_path = Path('version-history.json')
          history = json.loads(history_path.read_text(encoding='utf-8'))
          if not history or history[0].get('version') != '0.1.1-dev.73':
              history.insert(0, {
                  'version': '0.1.1-dev.73',
                  'date': '2026-08-12',
                  'summary': 'Resolve Jira equipment through workspace Users/person identity objects while preserving bounded user binding.',
                  'notes': 'docs/releases/0.1.1-dev.73.md'
              })
              history_path.write_text(json.dumps(history, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          Path('.github/workflows/dev73-metadata.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add changelog.md docs/releases/README.md version-history.json .github/workflows/dev73-metadata.yml
          git commit -m "Sync dev73 release metadata"
          git push origin HEAD:fix/jira-assets-user-object-bridge
