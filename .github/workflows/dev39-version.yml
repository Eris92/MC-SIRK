name: Dev39 Version

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - name: Prepare dev39 metadata
        run: python3 .github/scripts/dev39_version.py
      - name: Commit dev39 metadata
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '4189824+Eris92@users.noreply.github.com'
          git add package.json config.json README.md docs/PROJECT-STATE.md docs/releases/README.md docs/releases/0.1.1-dev.39.md changelog.md version-history.json
          git commit -m 'chore: prepare 0.1.1-dev.39 test build'
          git push origin HEAD:${{ github.head_ref }}
