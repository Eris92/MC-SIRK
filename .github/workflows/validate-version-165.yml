name: Validate version 165
on:
  push:
    branches:
      - issue-165-version-bump
    paths:
      - '.github/workflows/validate-version-165.yml'
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: issue-165-version-bump
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Apply metadata
        run: python3 .github/version-165.py
      - name: Remove temporary validation files
        run: rm .github/version-165.py .github/workflows/validate-version-165.yml
      - name: Targeted metadata validation
        run: node scripts/validate-repository-layout.js
      - name: Full test suite
        run: npm test
      - name: Diff check
        run: git diff --check
      - name: Save verified metadata
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: synchronize 0.1.1-dev.9 metadata"
          git push origin HEAD:issue-165-version-bump
