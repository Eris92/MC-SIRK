name: Apply pre-handoff result cleanup

on:
  push:
    branches:
      - refactor/pre-handoff-cleanup-1.8.20
    paths:
      - scripts/pre-handoff-results.py
      - .github/workflows/pre-handoff-results.yml

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/pre-handoff-cleanup-1.8.20
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply transform
        run: python scripts/pre-handoff-results.py
      - name: Validate transformed sources
        run: |
          node --check public/shared/ui/results.js
          node --check plugin-main.js
          node --check admin.js
          test ! -e public/shared/ui/download-results.js
          test ! -e public/shared/ui/result-layout.js
          grep -q "parseDownloadResult" public/shared/ui/results.js
          grep -q "mc-results-download-button" public/shared/ui/results.js
          ! grep -R "MutationObserver" public/shared/ui/results.js
      - name: Remove one-shot tooling and commit
        run: |
          rm scripts/pre-handoff-results.py
          rm .github/workflows/pre-handoff-results.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Consolidate result rendering and remove observer layers"
          git push origin HEAD:refactor/pre-handoff-cleanup-1.8.20
