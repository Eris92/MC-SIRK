name: Validate pre-1.0 reset

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-pre1-reset.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm test
