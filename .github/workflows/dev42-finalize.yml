name: Dev42 Finalize
on:
  push:
    branches: [dev-42-admin-backlog]
permissions:
  contents: write
jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev-42-admin-backlog
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Finalize metadata
        run: python3 .tmp/dev42-finalize.py
      - name: Remove temporary finalizer before validation
        run: rm -f .github/workflows/dev42-finalize.yml .tmp/dev42-finalize.py
      - name: Exact-version full gate
        run: |
          node -e "const p=require('./package.json'),c=require('./config.json'); if(p.version!=='0.1.1-dev.42'||c.version!==p.version) process.exit(1); console.log(p.version)"
          npm test
          git diff --check
      - name: Commit clean dev42 candidate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: prepare 0.1.1-dev.42"
          git push origin HEAD:dev-42-admin-backlog
