name: Validate dev9 layout results follow-up
on:
  push:
    branches:
      - runtime-smoke-followup-dev9-layout-results
    paths:
      - '.github/workflows/validate-dev9-layout-results.yml'
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: runtime-smoke-followup-dev9-layout-results
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Apply shared geometry and Results fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing replacement target in {path}: {old[:120]}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          shared = 'public/shared/ui/shared-ui.css'
          replace(
              shared,
              '.mc-shared-primary,.mc-shared-secondary,.mc-shared-details{min-width:0;min-height:0;padding:12px;box-sizing:border-box;overflow-y:auto;overscroll-behavior:contain;background:transparent!important;color:inherit!important}.mc-shared-details{scrollbar-gutter:stable}',
              '.mc-shared-primary,.mc-shared-secondary,.mc-shared-details{min-width:0;min-height:0;padding:12px;box-sizing:border-box;overflow-y:auto;overscroll-behavior:contain;background:transparent!important;color:inherit!important}.mc-shared-primary{padding:12px 9px}.mc-shared-details{scrollbar-gutter:stable}'
          )
          replace(
              shared,
              '.mc-shared-layout.is-collapsed .mc-shared-primary .mc-shared-nav-item{display:flex;align-items:center;justify-content:center;width:48px;min-width:48px;height:42px;padding:6px;margin:0 auto 3px;font-size:0}',
              '.mc-shared-layout.is-collapsed .mc-shared-primary .mc-shared-nav-item{display:flex;align-items:center;justify-content:center;width:48px;min-width:48px;height:44px;min-height:44px;padding:8px;margin:0 auto 3px;font-size:0}'
          )
          replace(
              shared,
              '.mc-shared-nav-item{display:flex;align-items:center;gap:9px;width:100%;min-width:0;min-height:36px;padding:8px;box-sizing:border-box;text-align:left;cursor:pointer}.mc-nav-icon{display:inline-flex;align-items:center;justify-content:center;width:24px;min-width:24px;height:24px;font-size:18px}',
              '.mc-shared-nav-item{display:flex;align-items:center;gap:9px;width:100%;min-width:0;min-height:36px;padding:8px;box-sizing:border-box;text-align:left;cursor:pointer}.mc-nav-icon{display:inline-flex;align-items:center;justify-content:center;width:24px;min-width:24px;height:24px;font-size:18px}.mc-shared-primary .mc-shared-nav-item .mc-nav-icon{width:28px;min-width:28px;height:28px}'
          )
          replace(
              shared,
              '.mc-results-table .mc-results-col-actions{min-width:120px;white-space:nowrap}',
              '.mc-results-table .mc-results-col-view{min-width:72px;width:72px;max-width:72px;white-space:nowrap}.mc-results-table .mc-results-col-actions{min-width:120px;white-space:nowrap}'
          )

          results = 'public/shared/ui/results.js'
          replace(
              results,
              '        if (key === "view" || key === "actions" || key === "action") return "mc-results-col-actions";',
              '        if (key === "view") return "mc-results-col-view";\n        if (key === "actions" || key === "action") return "mc-results-col-actions";'
          )
          replace(
              results,
              'if (options.showView !== false) { var viewHead = document.createElement("th"); viewHead.className = "mc-results-col-actions"; viewHead.textContent = "View"; header.appendChild(viewHead); }',
              'if (options.showView !== false) { var viewHead = document.createElement("th"); viewHead.className = "mc-results-col-view"; viewHead.textContent = "View"; header.appendChild(viewHead); }'
          )
          replace(
              results,
              'if (options.showView !== false) { var viewCell = tableRow.insertCell(), view = document.createElement("button"); viewCell.className = "mc-results-col-actions";',
              'if (options.showView !== false) { var viewCell = tableRow.insertCell(), view = document.createElement("button"); viewCell.className = "mc-results-col-view";'
          )

          stable = 'test/stable-first-column-icon-size.test.js'
          replace(
              stable,
              'var tree = read("public/shared/ui/tree.js");\n',
              'var tree = read("public/shared/ui/tree.js");\nvar approvals = read("public/modules/approvals/index.js");\n'
          )
          marker = '''assert.ok(shared.indexOf('.mc-shared-layout.is-collapsed .mc-shared-primary{padding:12px 6px;overflow:hidden}') >= 0,\n    "Collapse must preserve the expanded primary column's 12 px vertical origin while only tightening horizontal padding.");\n\n'''
          extra = marker + '''assert.ok(shared.indexOf('.mc-shared-primary{padding:12px 9px}') >= 0,\n    "Expanded first-column horizontal padding must place the 28 px icon center on the collapsed 64 px track axis.");\nassert.ok(shared.indexOf('.mc-shared-primary .mc-shared-nav-item .mc-nav-icon{width:28px;min-width:28px;height:28px}') >= 0,\n    "Approval Center first-column navigation must reuse the same 28 px icon box as Commands/Scripts/Quick.");\nassert.ok(shared.indexOf('.mc-shared-layout.is-collapsed .mc-shared-primary .mc-shared-nav-item{display:flex;align-items:center;justify-content:center;width:48px;min-width:48px;height:44px;min-height:44px;padding:8px;margin:0 auto 3px;font-size:0}') >= 0,\n    "Approval Center collapsed navigation must keep the same 44 px row geometry as expanded first-column rows.");\nassert.ok(approvals.indexOf('button.className = "mc-shared-nav-item "') >= 0 && approvals.indexOf('icon.className = "mc-nav-icon"') >= 0,\n    "Approval Center must remain a direct consumer of the shared first-column geometry owner.");\n\n'''
          replace(stable, marker, extra)

          readability = 'test/results-table-readability.test.js'
          marker = '''assert.ok(css.indexOf('.mc-results-table .mc-results-col-short{min-width:105px;white-space:nowrap}') >= 0,\n    "DateTime/Status/Approval style columns must stay compact and unbroken.");\n'''
          extra = marker + '''assert.ok(results.indexOf('if (key === "view") return "mc-results-col-view"') >= 0 &&\n    results.indexOf('if (key === "actions" || key === "action") return "mc-results-col-actions"') >= 0,\n    "View and Actions must have distinct shared semantic width roles.");\nassert.ok(css.indexOf('.mc-results-table .mc-results-col-view{min-width:72px;width:72px;max-width:72px;white-space:nowrap}') >= 0,\n    "View must use a compact fixed track sized for one button.");\nassert.ok(css.indexOf('.mc-results-table .mc-results-col-actions{min-width:120px;white-space:nowrap}') >= 0,\n    "Actions must retain enough width for Approve/Reject controls.");\nassert.ok(results.indexOf('viewHead.className = "mc-results-col-view"') >= 0 &&\n    results.indexOf('viewCell.className = "mc-results-col-view"') >= 0,\n    "Shared mountTable must apply the compact View role to both header and body cells.");\n'''
          replace(readability, marker, extra)
          PY
      - name: Remove temporary workflow
        shell: bash
        run: rm -f .github/workflows/validate-dev9-layout-results.yml
      - name: Targeted regression tests
        run: |
          node test/stable-first-column-icon-size.test.js
          node test/shared-list-quick-style.test.js
          node test/approval-selected-state.test.js
          node test/results-table-readability.test.js
      - name: Full test suite
        run: npm test
      - name: Diff check
        run: git diff --check
      - name: Save verified follow-up
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: stabilize first-column axis and compact View column'
          git push origin HEAD:runtime-smoke-followup-dev9-layout-results
