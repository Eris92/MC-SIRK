name: Cleanup obsolete development releases

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-obsolete-dev-releases.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete obsolete GitHub releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for tag in v1.8.20 v1.8.21; do
            release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq '.id' 2>/dev/null || true)"
            if [[ -n "$release_id" ]]; then
              echo "Deleting release ${tag} (${release_id})"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${release_id}"
            fi

            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
              echo "Deleting tag ${tag}"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}"
            fi
          done
