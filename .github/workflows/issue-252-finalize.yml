name: Issue 252 Finalize

on:
  push:
    branches:
      - issue-252-jira-protocol-runtime

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: issue-252-jira-protocol-runtime
      - name: Apply dev45 metadata and correctness cleanup
        run: python scripts/issue-252-finalize.py
      - name: Remove branch-only finalizer before repository validation
        run: git rm -f scripts/issue-252-finalize.py .github/workflows/issue-252-finalize.yml
      - name: Validate clean candidate
        run: |
          node -e "require('./server/core/pdf-text-renderer.js').renderTextPdf('Zażółć gęślą jaźń')"
          node test/jira-protocol-runtime.test.js
          node scripts/validate-repository-layout.js
          git diff --check
      - name: Commit clean candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: bump development revision to 0.1.1-dev.45"
          git push origin HEAD:issue-252-jira-protocol-runtime
