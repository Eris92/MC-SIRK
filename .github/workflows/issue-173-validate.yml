name: Validate issue 173 dialog surface
on:
  push:
    branches:
      - issue-173-move-dialog-surface
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Remove temporary workflow from validation tree
        run: rm .github/workflows/issue-173-validate.yml
      - name: Targeted dialog surface regression
        run: node test/move-request-dialog-surface.test.js
      - name: Targeted Move Request submit lifecycle regression
        run: node test/move-request-submit-feedback.test.js
      - name: Full test suite
        run: npm test
      - name: Diff check
        run: git diff --check
