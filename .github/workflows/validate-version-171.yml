name: Validate version 171

on:
  push:
    branches:
      - issue-171-version-bump
    paths:
      - .github/workflows/validate-version-171.yml

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: issue-171-version-bump
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Apply metadata
        run: node scripts/tmp-bump-171.js
      - name: Remove temporary validation files
        run: rm .github/workflows/validate-version-171.yml scripts/tmp-bump-171.js
      - name: Targeted metadata validation
        run: node scripts/validate-repository-layout.js
      - name: Full test suite
        run: npm test
      - name: Diff check
        run: git diff --check
      - name: Save verified metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: synchronize 0.1.1-dev.11 metadata'
          git push origin HEAD:issue-171-version-bump
