name: Validate stable icon size 155

on:
  push:
    branches:
      - issue-155-stable-icon-size
    paths:
      - .github/workflows/validate-stable-icon-size-155.yml

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: issue-155-stable-icon-size
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Apply stable icon geometry
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('public/shared/ui/toolbar.css')
          text = p.read_text()
          old = '.sirk-shared-list-item,.sirk-quick-command-categories>button,.sirk-quick-command-tree>button{display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;align-items:start;width:100%;min-width:0;min-height:36px;margin:0 0 3px;padding:8px;box-sizing:border-box;text-align:left;white-space:normal;line-height:1.28;cursor:pointer}.sirk-shared-list-icon,.sirk-quick-command-icon{display:grid;place-items:center;width:20px;min-width:20px;height:20px;max-width:20px;object-fit:contain}.sirk-shared-list-icon svg,.sirk-quick-command-icon svg{display:block;width:20px;height:20px}.sirk-shared-list-copy,.sirk-quick-command-copy{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;gap:6px;min-width:0}'
          new = '.sirk-shared-list-item,.sirk-quick-command-categories>button,.sirk-quick-command-tree>button{display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;align-items:start;width:100%;min-width:0;min-height:36px;margin:0 0 3px;padding:8px;box-sizing:border-box;text-align:left;white-space:normal;line-height:1.28;cursor:pointer}.sirk-shared-list-icon,.sirk-quick-command-icon{display:grid;place-items:center;width:20px;min-width:20px;height:20px;max-width:20px;object-fit:contain}.sirk-shared-list-icon svg,.sirk-quick-command-icon svg{display:block;width:20px;height:20px}.mc-shared-primary>.sirk-shared-list-item,.sirk-quick-command-browser .mc-shared-primary>button{grid-template-columns:28px minmax(0,1fr)}.mc-shared-primary>.sirk-shared-list-item .sirk-shared-list-icon,.sirk-quick-command-browser .mc-shared-primary>button .sirk-quick-command-icon{width:28px;min-width:28px;height:28px;max-width:28px}.mc-shared-primary>.sirk-shared-list-item .sirk-shared-list-icon svg,.sirk-quick-command-browser .mc-shared-primary>button .sirk-quick-command-icon svg{width:24px;height:24px}.sirk-shared-list-copy,.sirk-quick-command-copy{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;gap:6px;min-width:0}'
          if text.count(old) != 1:
              raise SystemExit('generic shared/Quick icon geometry block not found exactly once')
          text = text.replace(old, new, 1)
          old = '.mc-shared-layout.is-collapsed .mc-shared-primary>.sirk-shared-list-item .sirk-shared-list-icon,.sirk-quick-command-browser.is-collapsed .mc-shared-primary>button .sirk-quick-command-icon{width:28px;min-width:28px;height:28px;max-width:28px}.mc-shared-layout.is-collapsed .mc-shared-primary>.sirk-shared-list-item .sirk-shared-list-icon svg,.sirk-quick-command-browser.is-collapsed .mc-shared-primary>button .sirk-quick-command-icon svg{width:24px;height:24px}\n'
          if text.count(old) != 1:
              raise SystemExit('collapsed toolbar icon scaling block not found exactly once')
          text = text.replace(old, '', 1)
          p.write_text(text)

          p = Path('public/shared/ui/shared-ui.css')
          text = p.read_text()
          old = '.mc-shared-layout.is-collapsed .mc-shared-primary .mc-tree-root img,.mc-shared-layout.is-collapsed .mc-shared-primary .mc-tree-icon{width:28px;height:28px;flex-basis:28px}.mc-shared-layout.is-collapsed .mc-shared-primary .mc-tree-fallback-icon{width:28px;min-width:28px;font-size:18px}'
          if text.count(old) != 1:
              raise SystemExit('collapsed shared tree icon scaling block not found exactly once')
          text = text.replace(old, '', 1)
          p.write_text(text)
          PY
          cat > test/stable-first-column-icon-size.test.js <<'EOF'
          "use strict";

          var assert = require("assert");
          var fs = require("fs");
          var path = require("path");
          var root = path.resolve(__dirname, "..");
          function read(relative) { return fs.readFileSync(path.join(root, relative), "utf8"); }
          var toolbar = read("public/shared/ui/toolbar.css");
          var shared = read("public/shared/ui/shared-ui.css");
          var layout = read("public/shared/ui/layout.js");
          var tree = read("public/shared/ui/tree.js");

          assert.ok(toolbar.indexOf('.mc-shared-primary>.sirk-shared-list-item,.sirk-quick-command-browser .mc-shared-primary>button{grid-template-columns:28px minmax(0,1fr)}') >= 0,
              "Expanded and collapsed first-column rows must reserve one stable 28 px icon box.");
          assert.ok(toolbar.indexOf('.mc-shared-primary>.sirk-shared-list-item .sirk-shared-list-icon,.sirk-quick-command-browser .mc-shared-primary>button .sirk-quick-command-icon{width:28px;min-width:28px;height:28px;max-width:28px}') >= 0,
              "My Scripts/My Commands and Quick first-column icon boxes must stay 28x28 in every Collapse state.");
          assert.ok(toolbar.indexOf('.mc-shared-primary>.sirk-shared-list-item .sirk-shared-list-icon svg,.sirk-quick-command-browser .mc-shared-primary>button .sirk-quick-command-icon svg{width:24px;height:24px}') >= 0,
              "Monochrome first-column SVG artwork must stay 24x24 in every Collapse state.");

          assert.ok(toolbar.indexOf('.sirk-shared-list-icon,.sirk-quick-command-icon{display:grid;place-items:center;width:20px;min-width:20px;height:20px;max-width:20px;object-fit:contain}') >= 0,
              "Second-column/shared list icons must retain their existing compact 20 px geometry.");
          assert.ok(toolbar.indexOf('.sirk-shared-list-icon svg,.sirk-quick-command-icon svg{display:block;width:20px;height:20px}') >= 0,
              "Non-primary SVG icons must retain the existing compact 20 px geometry.");

          assert.strictEqual(/is-collapsed[^}]*sirk-shared-list-icon[^}]*width:/.test(toolbar), false,
              "Collapse CSS must not resize shared first-column icons.");
          assert.strictEqual(/is-collapsed[^}]*sirk-quick-command-icon[^}]*width:/.test(toolbar), false,
              "Quick Collapse CSS must not resize category icons.");
          assert.strictEqual(/is-collapsed[^}]*mc-tree-root img[^}]*width:/.test(shared), false,
              "Shared Collapse CSS must not resize custom root images.");
          assert.strictEqual(/is-collapsed[^}]*mc-tree-fallback-icon[^}]*width:/.test(shared), false,
              "Shared Collapse CSS must not resize fallback root artwork.");

          assert.ok(tree.indexOf('image.className = (className || "mc-tree-icon") + " sirk-shared-list-icon"') >= 0,
              "Custom root images must reuse the same primary icon-size owner with object-fit containment.");
          assert.ok(layout.indexOf('entry.root.classList.toggle("is-collapsed", entry.collapsed)') >= 0 &&
              layout.indexOf('createElement("style")') < 0,
              "Collapse lifecycle must remain state/class-only with no runtime icon sizing.");
          assert.ok(shared.indexOf('--sirk-primary-collapsed-track:64px') >= 0,
              "Stable icon size must preserve the canonical 64 px collapsed primary track.");
          assert.ok(toolbar.indexOf('.mc-shared-page :is(.sirk-shared-list-item,.mc-shared-nav-item):is(.active,.is-active)') >= 0,
              "Stable larger first-column icons must preserve the shared selected-state indicator contract.");

          console.log("First-column icons keep one stable expanded/collapsed size without changing second-column geometry: OK");
          EOF
          rm .github/workflows/validate-stable-icon-size-155.yml
      - name: Targeted icon geometry tests
        run: |
          node test/stable-first-column-icon-size.test.js
          node test/shared-list-quick-style.test.js
          node test/shared-column-alignment.test.js
          node test/neutral-navigation-icons.test.js
          node test/approval-selected-state.test.js
      - name: Full test suite
        run: npm test
      - name: Diff check
        run: |
          git diff --check
          git status --short
      - name: Save verified fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: keep first-column icon size stable"
          git push origin HEAD:issue-155-stable-icon-size
