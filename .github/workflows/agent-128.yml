name: Agent 128

on:
  push:
    branches: [issue-128-network-commands]
    paths:
      - '.github/workflows/agent-128.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: issue-128-network-commands
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Apply targeted patches
        run: python3 .github/agent_128.py
      - name: Syntax and catalog tests
        run: |
          node --check server/modules/commands/index.js
          node --check public/modules/commands/index.js
          node --check public/native/desktop-commands.js
          node test/network-command-split.test.js
          node test/command-click-execution.test.js
          node test/quick-semantic-icon-tone.test.js
          node test/script-run-as-mode.test.js
      - name: Parse embedded PowerShell without executing it
        run: |
          node <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('server/modules/commands/index.js', 'utf8');
          const start = source.indexOf('{ id: "network-adapter-properties"');
          const end = source.indexOf('\n                { id:', start + 1);
          if (start < 0 || end < 0) throw new Error('network-adapter-properties entry not found');
          const segment = source.slice(start, end);
          const match = segment.match(/cmd: ("(?:\\.|[^"\\])*")/);
          if (!match) throw new Error('command literal not found');
          const command = JSON.parse(match[1]);
          const marker = ' -Command "';
          const offset = command.indexOf(marker);
          if (offset < 0 || !command.endsWith('"')) throw new Error('PowerShell payload boundary not found');
          fs.writeFileSync('/tmp/network-adapter-properties.ps1', command.slice(offset + marker.length, -1));
          NODE
          pwsh -NoProfile -Command '$tokens=$null;$errors=$null;[System.Management.Automation.Language.Parser]::ParseFile("/tmp/network-adapter-properties.ps1",[ref]$tokens,[ref]$errors)|Out-Null;if($errors.Count -gt 0){$errors|ForEach-Object{Write-Error $_};exit 1}'
      - name: Commit verified change
        run: |
          rm .github/agent_128.py .github/workflows/agent-128.yml
          git config user.name "Eris92"
          git config user.email "43513086+Eris92@users.noreply.github.com"
          git add server/modules/commands/index.js public/modules/commands/index.js public/native/desktop-commands.js test/network-command-split.test.js .github/agent_128.py .github/workflows/agent-128.yml
          git commit -m "feat: split network panel and adapter properties commands"
          git push origin HEAD:issue-128-network-commands
