name: Dev48 Patch
on:
  push:
    branches:
      - fix/dev48-smoke-followup
concurrency:
  group: dev48-patch-${{ github.ref }}
  cancel-in-progress: true
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/dev48-smoke-followup.js
      - run: node test/dev48-smoke-followup.test.js
      - run: npm test
      - name: Commit patch
        run: |
          rm -f scripts/dev48-smoke-followup.js .github/workflows/dev48-patch.yml docs/dev48-runner-blocker.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: prepare dev.48 smoke follow-up"
          git push
