name: Agent fix workspace test

on:
  push:
    branches: [issues-115-120-shared-ui]
    paths:
      - '.github/workflows/agent-fix-workspace-test.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: issues-115-120-shared-ui
      - name: Patch stale selector contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('test/workspace-page-style.test.js')
          text = p.read_text()
          old = '''assert.ok(\n    toolbar.indexOf(".mc-shared-page:is(.is-edit-mode,.is-multi-mode) .mc-shared-layout{grid-template-columns:") >= 0,\n    "Toolbar CSS may own only the Edit/Multi layout exception needed for the measured action track."\n);'''
          new = '''assert.ok(\n    toolbar.indexOf(".mc-shared-page.is-edit-mode .mc-shared-layout{grid-template-columns:") >= 0 &&\n    toolbar.indexOf(".mc-shared-page.is-multi-mode .mc-shared-layout{grid-template-columns:") >= 0,\n    "Toolbar CSS may own only explicit Edit/Multi layout exceptions needed for their measured mode geometry."\n);'''
          if old not in text:
              raise SystemExit('stale workspace selector assertion not found')
          p.write_text(text.replace(old, new, 1))
          PY
          node test/workspace-page-style.test.js
      - name: Commit verified contract
        run: |
          rm .github/workflows/agent-fix-workspace-test.yml
          git config user.name "Eris92"
          git config user.email "43513086+Eris92@users.noreply.github.com"
          git add test/workspace-page-style.test.js .github/workflows/agent-fix-workspace-test.yml
          git commit -m "test: align workspace mode selector contract"
          git push origin HEAD:issues-115-120-shared-ui
