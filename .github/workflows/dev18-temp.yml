name: Dev18 Temp
on:
  push:
    branches:
      - chore/198-dev18
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/198-dev18
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Sync metadata
        run: node scripts/.tmp-dev18.js
      - name: Validate final tree
        run: |
          node scripts/validate-repository-layout.js
          npm test
          git diff --check
      - name: Commit final metadata
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore(version): bump development revision to 0.1.1-dev.18"
          git push origin HEAD:chore/198-dev18
