name: Dev42 Admin
on:
  push:
    branches: [dev-42-admin-backlog]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev-42-admin-backlog
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply patch
        run: |
          python3 .tmp/dev42-admin-patch.py
          python3 .tmp/dev42-admin-testfix.py
          python3 .tmp/dev42-admin-placementfix.py
      - name: Targeted tests
        run: |
          node test/admin-permissions-ui.test.js
          node test/admin-permissions-settings.test.js
          node test/admin-disclosure-contract.test.js
          node test/admin-permissions-placement.test.js
          node test/admin-move-request-policy-ui.test.js
          node test/admin-host-theme-signal.test.js
          node test/admin-host-theme-runtime.test.js
          node test/admin-settings-save.test.js
      - name: Full suite without temporary workflow
        run: |
          rm -f .github/workflows/dev42-admin.yml .tmp/dev42-admin-patch.py .tmp/dev42-admin-testfix.py .tmp/dev42-admin-placementfix.py
          npm test
          git diff --check
      - name: Commit clean runtime changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: complete Admin permissions and Move Request policy UI"
          git push origin HEAD:dev-42-admin-backlog
