name: Validate dev.15 metadata bump
on:
  push:
    branches:
      - issue-186-version-dev15
permissions:
  contents: write
jobs:
  bump-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: issue-186-version-dev15
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Prepare metadata
        run: node scripts/tmp-issue-186-bump-dev15.js
      - name: Remove temporary helpers
        run: rm scripts/tmp-issue-186-bump-dev15.js .github/workflows/issue-186-bump.yml
      - name: Targeted repository metadata validation
        run: node scripts/validate-repository-layout.js
      - name: Full test suite
        run: npm test
      - name: Diff check
        run: git diff --check
      - name: Commit validated bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json config.json README.md docs/PROJECT-STATE.md docs/releases/README.md docs/releases/0.1.1-dev.15.md changelog.md version-history.json
          git add -u scripts/tmp-issue-186-bump-dev15.js .github/workflows/issue-186-bump.yml
          git commit -m "chore: bump development revision to 0.1.1-dev.15"
          git push origin HEAD:issue-186-version-dev15
