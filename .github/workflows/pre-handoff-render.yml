name: Apply pre-handoff render cleanup

on:
  push:
    branches:
      - refactor/pre-handoff-cleanup-1.8.20
    paths:
      - scripts/pre-handoff-render.py
      - .github/workflows/pre-handoff-render.yml

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/pre-handoff-cleanup-1.8.20
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply transform
        run: python scripts/pre-handoff-render.py
      - name: Validate transformed sources
        run: |
          node --check public/shared/module-shell.js
          node --check public/shared/ui/layout.js
          ! grep -q "MutationObserver" public/shared/ui/layout.js
          ! grep -q "createElement(\"style\")" public/shared/ui/layout.js
      - name: Remove one-shot tooling and commit
        run: |
          rm scripts/pre-handoff-render.py
          rm .github/workflows/pre-handoff-render.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Consolidate stable rendering into module shell"
          git push origin HEAD:refactor/pre-handoff-cleanup-1.8.20
