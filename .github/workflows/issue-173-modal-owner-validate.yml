name: Validate issue 173 modal variable owner

on:
  push:
    branches:
      - issue-173-modal-variable-owner
    paths:
      - '.github/workflows/issue-173-modal-owner-validate.yml'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Apply modal variable-owner fix
        run: python3 scripts/tmp-issue-173-modal-owner.py
      - name: Targeted Move Request surface regression
        run: node test/move-request-dialog-surface.test.js
      - name: Targeted shared surface regression
        run: node test/shared-workspace-surface.test.js
      - name: Targeted Move Request submit regression
        run: node test/move-request-submit-feedback.test.js
      - name: Full test suite
        run: npm test
      - name: Diff check
        run: git diff --check
      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore native Move Request modal scope"
          git push origin HEAD:issue-173-modal-variable-owner
