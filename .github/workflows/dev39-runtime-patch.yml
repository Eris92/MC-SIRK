name: Dev39 Runtime Patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - name: Apply targeted runtime patch
        run: python3 .github/scripts/dev39_runtime_patch.py
      - name: Commit targeted runtime patch
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '4189824+Eris92@users.noreply.github.com'
          git add server/modules/commands/index.js web/admin/admin.js test/network-command-split.test.js test/admin-host-theme-signal.test.js
          git commit -m 'fix: direct Network Settings and current host theme precedence'
          git push origin HEAD:${{ github.head_ref }}
