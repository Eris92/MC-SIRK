name: Validate action mode geometry 116 v2

on:
  push:
    branches: [fix-action-mode-text-116]
    paths:
      - '.github/workflows/validate-action-mode-116-v2.yml'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: fix-action-mode-text-116
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Reapply verified patch with corrected lifecycle assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/validate-action-mode-116.yml').read_text()
          marker = "python - <<'PY'\n"
          if marker not in workflow:
              raise SystemExit('source patch workflow marker not found')
          script = workflow.split(marker, 1)[1].split('\n          PY', 1)[0]
          exec(compile(textwrap.dedent(script), 'action-mode-patch.py', 'exec'), {})

          path = Path('test/edit-toggle-atomic.test.js')
          text = path.read_text()
          old = '''    assert.strictEqual(active.multi, false, "Edit must still clear multi mode immediately.");'''
          new = '''    assert.strictEqual(tool.state.multiPickMode, false,\n        "Edit must clear the Multi state before staging the new tree.");\n    assert.strictEqual(active.multi, undefined,\n        "Edit must not mutate live Multi geometry before the atomic render commits.");'''
          if old not in text:
              raise SystemExit('stale immediate Multi geometry assertion not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/validate-action-mode-116.yml
          rm .github/workflows/validate-action-mode-116-v2.yml
      - name: Targeted shared action mode tests
        run: |
          node test/edit-live-geometry.test.js
          node test/edit-toggle-atomic.test.js
          node test/script-mode-layout.test.js
          node test/tree-single-action-container.test.js
          node test/button-style-contract.test.js
      - name: Run full test suite
        run: npm test
      - name: Check diff
        run: |
          git diff --check
          git status --short
      - name: Save verified fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: keep action mode text geometry stable"
          git push origin HEAD:fix-action-mode-text-116
