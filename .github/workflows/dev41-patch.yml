name: Dev41 Patch
on:
  push:
    branches: [dev-41-elevated-network-admin-surface]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev-41-elevated-network-admin-surface
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply patch
        run: python3 .tmp/dev41_patch.py
      - name: Remove temporary infrastructure before tests
        run: rm -f .tmp/dev41_patch.py .github/workflows/dev41-patch.yml
      - name: Targeted tests
        run: |
          node test/network-command-split.test.js
          node test/logged-on-user-command-policy.test.js
          node test/admin-host-theme-signal.test.js
      - name: Full test
        run: npm test
      - name: Diff check
        run: git diff --check
      - name: Commit runtime changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: use elevated Network user token and actual Admin host surface'
          git push origin HEAD:dev-41-elevated-network-admin-surface
