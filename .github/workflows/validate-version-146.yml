name: Validate version 146

on:
  push:
    branches: [issue-146-version-bump]
    paths:
      - '.github/workflows/validate-version-146.yml'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: issue-146-version-bump
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Synchronize development metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          readme = Path('README.md')
          text = readme.read_text()
          text = text.replace('# SIRK Management Platform 0.1.1-dev.4', '# SIRK Management Platform 0.1.1-dev.5', 1)
          text = text.replace('[Aktualne development notes](docs/releases/0.1.1-dev.4.md)', '[Aktualne development notes](docs/releases/0.1.1-dev.5.md)', 1)
          readme.write_text(text)

          state = Path('docs/PROJECT-STATE.md')
          text = state.read_text()
          text = text.replace('Current version: `0.1.1-dev.4`', 'Current version: `0.1.1-dev.5`', 1)
          text = text.replace('package.json -> 0.1.1-dev.4', 'package.json -> 0.1.1-dev.5', 1)
          text = text.replace('config.json  -> 0.1.1-dev.4', 'config.json  -> 0.1.1-dev.5', 1)
          text = text.replace('Aktualne development notes: `docs/releases/0.1.1-dev.4.md`.', 'Aktualne development notes: `docs/releases/0.1.1-dev.5.md`.', 1)
          state.write_text(text)

          releases = Path('docs/releases/README.md')
          text = releases.read_text()
          old = '- [`0.1.1-dev.4`](0.1.1-dev.4.md) — bieżąca rewizja development z atomic Edit lifecycle fix do real MeshCentral re-smoke;'
          new = '- [`0.1.1-dev.5`](0.1.1-dev.5.md) — bieżąca rewizja development ze wspólną stabilną geometrią Edit/Multi do real MeshCentral re-smoke;\n- [`0.1.1-dev.4`](0.1.1-dev.4.md) — poprzednia rewizja development z atomic Edit lifecycle fix;'
          if old not in text: raise SystemExit('release index current line not found')
          releases.write_text(text.replace(old, new, 1))

          changelog = Path('changelog.md')
          text = changelog.read_text()
          text = text.replace('Current development notes: `docs/releases/0.1.1-dev.4.md`.', 'Development notes: `docs/releases/0.1.1-dev.4.md`.', 1)
          marker = '# Changelog\n\n'
          entry = '''## 0.1.1-dev.5 — 2026-08-08\n\n- Bump the pre-1.0 development revision so MeshCentral update detection can install the shared Edit/Multi geometry fix from current `main`.\n- Keep the normal second-column text track and label wrapping stable while Edit or Multi actions appear by reserving the measured action rail outside the captured text width.\n- Use the same post-atomic-commit lifecycle for Edit and Multi so action-mode switches do not transiently move or squeeze text.\n- Keep the revision below `1.0.0`; this is not a product release and does not create a tag or GitHub Release.\n\nCurrent development notes: `docs/releases/0.1.1-dev.5.md`.\n\n'''
          if marker not in text: raise SystemExit('changelog marker missing')
          changelog.write_text(text.replace(marker, marker + entry, 1))

          history = Path('version-history.json')
          values = json.loads(history.read_text())
          if not values or values[0].get('version') != '0.1.1-dev.4': raise SystemExit('unexpected version-history head')
          values.insert(0, {
              'version': '0.1.1-dev.5',
              'date': '2026-08-08',
              'changes': [
                  'Bump the pre-1.0 development revision so MeshCentral update detection can install the shared Edit/Multi geometry fix from current main.',
                  'Preserve the normal second-column text width and wrapping by placing the measured Edit/Multi action rail outside the captured text track.',
                  'Use one atomic post-commit geometry lifecycle for both Edit and Multi without new observers, polling, requests or per-module CSS.',
                  'Keep the change as a development revision below 1.0.0 with no automatic tag or GitHub Release.'
              ]
          })
          history.write_text(json.dumps(values, indent=2, ensure_ascii=False) + '\n')

          Path('docs/releases/0.1.1-dev.5.md').write_text('''# MC-SIRK 0.1.1-dev.5 — shared Edit/Multi geometry revision\n\nStatus: development pre-1.0, not a product release.\n\n`0.1.1-dev.5` podnosi rewizję development, aby mechanizm aktualizacji MeshCentral pobrał poprawkę wynikającą z real My Commands smoke dla Issue #116.\n\nTa rewizja obejmuje aktualny stan `main`, w tym:\n\n- Edit i Multi używają jednego shared geometry contractu;\n- bazowy text track drugiej kolumny oraz wrapping labeli pozostają bez zmian, gdy pojawia się action rail;\n- `secondary` rośnie wyłącznie o rzeczywiście zmierzoną szerokość action rail i istniejący column gap;\n- oba action modes synchronizują live geometry po atomic render commit, więc przełączanie nie powinno ściskać ani przestawiać tekstu;\n- brak nowych observerów, polling, requestów, per-module CSS lub dodatkowego renderera.\n\nBump nie zmienia release gate: wszystkie development revisions pozostają `< 1.0.0`. `1.0.0` jest zarezerwowane dla pierwszego kompletnego product release po jawnej decyzji użytkownika i wymaganym real MeshCentral smoke.\n\nNie tworzyć tagu ani GitHub Release dla tej development revision bez jawnego polecenia użytkownika.\n''')
          PY
          rm .github/workflows/validate-version-146.yml
      - name: Validate development metadata
        run: node scripts/validate-repository-layout.js
      - name: Run full test suite
        run: npm test
      - name: Check final diff
        run: |
          git diff --check
          git status --short
      - name: Save verified metadata
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs: synchronize 0.1.1-dev.5 metadata"
          git push origin HEAD:issue-146-version-bump
