name: Test

on:
  push:
    branches:
      - fix-runtime-smoke-117-118

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: fix-runtime-smoke-117-118
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Apply verified patch
        run: python scripts/agent-runtime-smoke-fix.py
      - name: Restore canonical workflow and remove helpers
        run: |
          cat > .github/workflows/test.yml <<'EOF'
          name: Test

          on:
            pull_request:
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            test:
              runs-on: ubuntu-latest
              timeout-minutes: 15
              steps:
                - name: Checkout
                  uses: actions/checkout@v7
                - name: Setup Node.js
                  uses: actions/setup-node@v7
                  with:
                    node-version: '24'
                    package-manager-cache: false
                - name: Run test suite
                  run: npm test
          EOF
          rm -f .github/workflows/agent-runtime-smoke-fix.yml scripts/agent-runtime-smoke-fix.py
      - name: Targeted tests
        run: |
          node test/quick-collapse-action-icon.test.js
          node test/quick-toolbar-nowrap.test.js
          node test/shared-toolbar-search-slot.test.js
          node test/quick-commands-compact-layout.test.js
          node test/quick-toolbar-order.test.js
          node test/desktop-commands-shell.test.js
      - name: Full test suite
        run: npm test
      - name: Commit verified fixes
        run: |
          git config user.name "Eris92"
          git config user.email "43513086+Eris92@users.noreply.github.com"
          git add -A
          git commit -m "fix: follow runtime toolbar smoke feedback"
          git push origin HEAD:fix-runtime-smoke-117-118
