name: Test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-network-settings:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - name: Apply verified Shell NOASYNC correction
        run: |
          node <<'NODE'
          const fs = require('fs');
          const serverPath = 'server/modules/commands/index.js';
          const testPath = 'test/network-command-split.test.js';
          let server = fs.readFileSync(serverPath, 'utf8');
          const match = /FromBase64String\('([A-Za-z0-9+/=]+)'\)/.exec(server);
          if (!match) throw new Error('Network Settings interop payload not found.');
          let interop = Buffer.from(match[1], 'base64').toString('utf8');
          if (interop.includes('info.fMask = 0x0000010C;')) {
            console.log('Network Settings NOASYNC patch already present.');
            process.exit(0);
          }
          const oldMask = 'info.fMask = 0x0000000C;';
          if (!interop.includes(oldMask)) throw new Error('Expected dev.35 Shell mask not found.');
          interop = interop.replace(oldMask, 'info.fMask = 0x0000010C;');
          const encoded = Buffer.from(interop, 'utf8').toString('base64');
          server = server.replace(match[1], encoded);
          fs.writeFileSync(serverPath, server, 'utf8');

          let test = fs.readFileSync(testPath, 'utf8');
          const oldAssertion = "interop.indexOf('info.fMask = 0x0000000C') >= 0";
          if (!test.includes(oldAssertion)) throw new Error('Expected dev.35 fMask assertion not found.');
          test = test.replace(oldAssertion, "interop.indexOf('info.fMask = 0x0000010C') >= 0");
          test = test.replace(
            '"Adapter properties must invoke the canonical Shell properties verb with SEE_MASK_INVOKEIDLIST on the resolved PIDL.");',
            '"Adapter properties must invoke the canonical Shell properties verb with SEE_MASK_INVOKEIDLIST | SEE_MASK_NOASYNC so the short-lived hidden helper cannot terminate before Shell activation completes.");\nassert.strictEqual(interop.indexOf(\'info.fMask = 0x0000000C\'), -1,\n    "The dev.35 async-prone ShellExecuteEx mask must not return.");'
          );
          test = test.replace(
            'console.log("Network panel and active-adapter properties use the Windows-verified PIDL Shell properties contract: OK");',
            'console.log("Network panel and active-adapter properties use the synchronous Windows Shell PIDL properties contract: OK");'
          );
          fs.writeFileSync(testPath, test, 'utf8');
          NODE
          git diff --check
          if git diff --quiet; then
            echo 'No patch required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/modules/commands/index.js test/network-command-split.test.js
          git commit -m 'fix: complete Network Settings Shell activation'
          git push origin HEAD:${{ github.head_ref }}

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Run test suite
        run: npm test

  windows-network-settings-diagnostic:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Extract exact Network Settings payload and launcher
        shell: pwsh
        run: |
          @'
          const fs = require('fs');
          const vm = require('vm');
          const source = fs.readFileSync('server/modules/commands/index.js', 'utf8');
          const marker = '{ id: "network-adapter-properties"';
          const start = source.indexOf(marker);
          if (start < 0) throw new Error('Network Settings catalog entry not found.');
          let end = source.indexOf('\n                { id:', start + marker.length);
          if (end < 0) end = source.indexOf('\n            ]', start + marker.length);
          const entry = source.slice(start, end);
          const cmdMarker = 'cmd: ';
          const cmdStart = entry.indexOf(cmdMarker);
          if (cmdStart < 0) throw new Error('Network Settings cmd literal not found.');
          let index = cmdStart + cmdMarker.length;
          while (/\s/.test(entry[index])) index++;
          const quote = entry[index];
          let escaped = false, finish = -1;
          for (let i = index + 1; i < entry.length; i++) {
            const ch = entry[i];
            if (escaped) { escaped = false; continue; }
            if (ch === '\\') { escaped = true; continue; }
            if (ch === quote) { finish = i + 1; break; }
          }
          if (finish < 0) throw new Error('Unterminated command literal.');
          const command = vm.runInNewContext(entry.slice(index, finish));
          const match = /^start\s+""\s+powershell\.exe\s+-NoProfile\s+-WindowStyle\s+Hidden\s+-Command\s+"([\s\S]*)"$/i.exec(command.trim());
          if (!match) throw new Error('Production command no longer matches the hidden PowerShell contract.');
          fs.writeFileSync('network-settings-command.txt', command, 'utf8');
          fs.writeFileSync('network-settings-payload.ps1', match[1], 'utf8');

          const helperStart = source.indexOf('    function psQuote(value)');
          const helperEnd = source.indexOf('    function injectVariables(', helperStart);
          if (helperStart < 0 || helperEnd < 0) throw new Error('Interactive Desktop launcher helpers not found.');
          const helperSource = source.slice(helperStart, helperEnd);
          const sandbox = { Buffer };
          vm.createContext(sandbox);
          vm.runInContext(helperSource + '\nthis.makeInteractive = interactiveDesktopCommand;', sandbox);
          const markerPath = String(process.env.RUNNER_TEMP || '').replace(/\\/g, '\\\\') + '\\\\network-settings-child.txt';
          const telemetry = ";$isAdmin=([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator);[IO.File]::WriteAllText('" + markerPath.replace(/'/g, "''") + "',('ps='+$PSVersionTable.PSVersion+';apartment='+[Threading.Thread]::CurrentThread.ApartmentState+';user='+[Security.Principal.WindowsIdentity]::GetCurrent().Name+';session='+[Diagnostics.Process]::GetCurrentProcess().SessionId+';admin='+$isAdmin));Start-Sleep -Seconds 3";
          const diagnosticCommand = command.replace(/"$/, telemetry + '"');
          const wrapper = sandbox.makeInteractive(diagnosticCommand, 'Network Settings diagnostic');
          fs.writeFileSync('network-settings-wrapper.ps1', wrapper, 'utf8');
          console.log('productionCommandLength=' + command.length);
          console.log('payloadLength=' + match[1].length);
          console.log('wrapperLength=' + wrapper.length);
          '@ | Set-Content -LiteralPath extract-network-settings.js -Encoding UTF8
          node .\extract-network-settings.js
      - name: Trace exact payload under Windows PowerShell 5.1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $payload = Get-Content -LiteralPath .\network-settings-payload.ps1 -Raw
          $prefix = '$ErrorActionPreference=''Stop'';Write-Output (''CHECKPOINT:runtime ps=''+$PSVersionTable.PSVersion+'' apartment=''+[Threading.Thread]::CurrentThread.ApartmentState+'' user=''+[Security.Principal.WindowsIdentity]::GetCurrent().Name+'' session=''+[Diagnostics.Process]::GetCurrentProcess().SessionId);'
          $payload = $prefix + $payload
          $payload = $payload.Replace('$adapter=Get-NetAdapter -InterfaceIndex $route.InterfaceIndex -ErrorAction Stop;', '$adapter=Get-NetAdapter -InterfaceIndex $route.InterfaceIndex -ErrorAction Stop;Write-Output (''CHECKPOINT:adapter name=''+$adapter.Name+'' ifIndex=''+$adapter.InterfaceIndex);')
          $payload = $payload.Replace('$folder=$shell.Namespace(49);', '$folder=$shell.Namespace(49);Write-Output (''CHECKPOINT:namespace49=''+[bool]$folder);')
          $payload = $payload.Replace('$item=$folder.Items()|Where-Object{$_.Name -eq $adapter.Name}|Select-Object -First 1;', '$item=$folder.Items()|Where-Object{$_.Name -eq $adapter.Name}|Select-Object -First 1;Write-Output (''CHECKPOINT:item=''+$item.Name+'' path=''+$item.Path);')
          $payload = $payload.Replace('Add-Type -TypeDefinition $source -ErrorAction Stop;', 'Write-Output ''CHECKPOINT:before-add-type'';Add-Type -TypeDefinition $source -ErrorAction Stop;Write-Output ''CHECKPOINT:after-add-type'';')
          $payload = $payload.Replace('[SirkNetworkShell]::ShowProperties($item)', 'Write-Output ''CHECKPOINT:before-properties'';[SirkNetworkShell]::ShowProperties($item);Write-Output ''CHECKPOINT:after-properties''')
          $encoded = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($payload))
          $stdout = Join-Path $env:RUNNER_TEMP 'network-settings.stdout.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'network-settings.stderr.txt'
          $exe = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $process = Start-Process -FilePath $exe -ArgumentList @('-NoProfile','-STA','-EncodedCommand',$encoded) -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $finished = $process.WaitForExit(15000)
          if (-not $finished) { Write-Host 'processTimeout=true'; Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue; $process.WaitForExit() }
          Write-Host ('processExitCode=' + $process.ExitCode)
          Write-Host '--- stdout ---'
          if (Test-Path $stdout) { Get-Content -LiteralPath $stdout }
          Write-Host '--- stderr ---'
          if (Test-Path $stderr) { Get-Content -LiteralPath $stderr }
          if ($process.ExitCode -ne 0) { throw ('Windows PowerShell 5.1 exact payload failed with exit code ' + $process.ExitCode) }
      - name: Trace exact scheduled-task and VBS launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $marker = Join-Path $env:RUNNER_TEMP 'network-settings-child.txt'
          Remove-Item -LiteralPath $marker -Force -ErrorAction SilentlyContinue
          $wrapper = Get-Content -LiteralPath .\network-settings-wrapper.ps1 -Raw
          Write-Host ('outerUser=' + [Security.Principal.WindowsIdentity]::GetCurrent().Name + '; outerSession=' + [Diagnostics.Process]::GetCurrentProcess().SessionId)
          Write-Host ('computerUser=' + (Get-CimInstance Win32_ComputerSystem -ErrorAction SilentlyContinue).UserName)
          $explorers = @(Get-Process explorer -IncludeUserName -ErrorAction SilentlyContinue | Where-Object { $_.UserName })
          Write-Host ('interactiveExplorers=' + $explorers.Count)
          $encoded = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($wrapper))
          $exe = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $outer = Start-Process -FilePath $exe -ArgumentList @('-NoProfile','-EncodedCommand',$encoded) -Wait -PassThru
          Write-Host ('outerExitCode=' + $outer.ExitCode)
          for ($attempt = 0; $attempt -lt 20 -and -not (Test-Path -LiteralPath $marker); $attempt++) { Start-Sleep -Milliseconds 500 }
          if (Test-Path -LiteralPath $marker) {
            Write-Host ('childTelemetry=' + (Get-Content -LiteralPath $marker -Raw))
          } else {
            throw 'Exact scheduled-task/VBS launcher did not reach the child telemetry marker.'
          }
