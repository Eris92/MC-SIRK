name: Test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-issue-253:
    if: github.event_name == 'pull_request' && github.head_ref == 'issue-253-shared-parameter-dialog'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: issue-253-shared-parameter-dialog
      - name: Apply scoped source patch
        run: python scripts/issue-253-apply.py
      - name: Commit scoped result and remove helper
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/test.yml
          git rm scripts/issue-253-apply.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(shared-ui): use native parameter dialog across execution surfaces"
          git push origin HEAD:issue-253-shared-parameter-dialog

  test:
    if: github.head_ref != 'issue-253-shared-parameter-dialog'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Run test suite
        run: npm test

  windows-interactive-shell-smoke:
    if: github.head_ref != 'issue-253-shared-parameter-dialog'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate Network Connections shell namespace
        shell: powershell
        run: .\test\windows-network-shell-smoke.ps1
