name: Test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate AI context tools
        run: node scripts/ai/test-tools.mjs
      - name: Run test suite
        run: npm test

  windows-interactive-shell-smoke:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate Git installer syntax
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\tools\install\Install-SIRK-Portal-FromGit.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Validate Network Connections shell namespace
        shell: powershell
        run: .\test\windows-network-shell-smoke.ps1
      - name: Validate ODBC 32-bit interactive UAC contract
        shell: powershell
        run: .\test\windows-odbc-command-smoke.ps1
      - name: Validate server date/time preset Windows PowerShell 5.1 syntax
        shell: powershell
        run: .\test\windows-server-time-sync-smoke.ps1
      - name: Validate SMS UTF-8 form encoding
        shell: powershell
        run: .\test\windows-sms-utf8-smoke.ps1
      - name: Validate AD selector bridge
        shell: powershell
        run: .\test\windows-ad-selector-bridge-smoke.ps1
      - name: Validate signed RDP command helpers
        shell: powershell
        run: .\test\windows-ca-rdp-smoke.ps1
      - name: Validate Nessus all-host report script
        shell: powershell
        run: .\test\windows-nessus-report-smoke.ps1
      - name: Validate Entra SMS Voice report parser and CSV protection
        shell: powershell
        run: .\test\windows-entra-sms-voice-report-smoke.ps1
