name: Test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-issue-252-submit-lock:
    if: github.event_name == 'pull_request' && github.head_ref == 'issue-252-jira-asset-protocol'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: issue-252-jira-asset-protocol
      - name: Apply protocol submit lock
        run: python scripts/issue-252-submit-lock.py
      - name: Commit scoped result and restore canonical workflow
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/test.yml
          git rm -f scripts/issue-252-submit-lock.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(jira): keep protocol submit locked until terminal progress"
          git push origin HEAD:issue-252-jira-asset-protocol

  test:
    if: github.head_ref != 'issue-252-jira-asset-protocol'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Run test suite
        run: npm test

  windows-interactive-shell-smoke:
    if: github.head_ref != 'issue-252-jira-asset-protocol'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate Network Connections shell namespace
        shell: powershell
        run: .\test\windows-network-shell-smoke.ps1
