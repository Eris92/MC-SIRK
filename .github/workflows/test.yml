name: Test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Run test suite
        run: npm test

  windows-network-shell-diagnostic:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Resolve Network Connection item PIDL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $route = Get-NetRoute -DestinationPrefix '0.0.0.0/0' -ErrorAction SilentlyContinue |
            Where-Object { $_.State -eq 'Alive' } |
            Sort-Object @{ Expression = { ([long]$_.RouteMetric) + ([long]$_.InterfaceMetric) }; Ascending = $true }, InterfaceMetric, RouteMetric, InterfaceIndex |
            Select-Object -First 1
          if (-not $route) { throw 'No live IPv4 default route on runner.' }
          $adapter = Get-NetAdapter -InterfaceIndex $route.InterfaceIndex -ErrorAction Stop
          Write-Host ('adapter=' + $adapter.Name + '; ifIndex=' + $adapter.InterfaceIndex + '; guid=' + $adapter.InterfaceGuid)

          $shell = New-Object -ComObject Shell.Application
          $folder49 = $shell.Namespace(49)
          $folderClsid = $shell.Namespace('::{7007ACC7-3202-11D1-AAD2-00805FC1270E}')
          Write-Host ('namespace49=' + [bool]$folder49 + '; namespaceClsid=' + [bool]$folderClsid)
          $folder = if ($folderClsid) { $folderClsid } else { $folder49 }
          if (-not $folder) { throw 'Network Connections shell folder could not be bound.' }

          $item = @($folder.Items()) | Where-Object { $_.Name -eq $adapter.Name } | Select-Object -First 1
          if (-not $item) { throw ('Runner adapter not found in Network Connections: ' + $adapter.Name) }
          Write-Host ('item=' + $item.Name + '; itemPath=' + $item.Path)

          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class SirkShellPidlProbe {
              [DllImport("shell32.dll")]
              static extern int SHGetIDListFromObject([MarshalAs(UnmanagedType.IUnknown)] object punk, out IntPtr ppidl);
              [DllImport("ole32.dll")]
              static extern void CoTaskMemFree(IntPtr pv);
              public static int Probe(object item) {
                  IntPtr pidl;
                  int hr = SHGetIDListFromObject(item, out pidl);
                  Console.WriteLine("pidl=" + (pidl != IntPtr.Zero));
                  if (pidl != IntPtr.Zero) CoTaskMemFree(pidl);
                  return hr;
              }
          }
          '@

          $hr = [SirkShellPidlProbe]::Probe($item)
          Write-Host ('SHGetIDListFromObject hresult=0x' + ([uint32]$hr).ToString('X8'))
          if ($hr -ne 0) { throw ('SHGetIDListFromObject failed: 0x' + ([uint32]$hr).ToString('X8')) }
