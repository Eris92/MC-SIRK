name: Test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: fix-edit-atomic-116
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Apply atomic Edit lifecycle fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('public/shared/ui/script-tools.js')
          source = path.read_text()
          old = 'toggleEdit: function (toolbar, onChange) { state.editMode = !state.editMode; stopPickModes("edit"); if (toolbar) { toolbar.setActive("manage", state.editMode); toolbar.setActive("link", false); toolbar.setActive("multi", false); } if (onChange) onChange(); },'
          new = '''toggleEdit: function (toolbar, onChange) {
                    state.editMode = !state.editMode;
                    stopPickModes("edit");
                    if (toolbar) { toolbar.setActive("link", false); toolbar.setActive("multi", false); }
                    var change;
                    try { change = onChange ? onChange() : null; }
                    catch (error) { if (toolbar) toolbar.setActive("manage", state.editMode); throw error; }
                    if (change && typeof change.then === "function") {
                        return Promise.resolve(change).then(function (result) {
                            if (toolbar) toolbar.setActive("manage", state.editMode);
                            return result;
                        }, function (error) {
                            if (toolbar) toolbar.setActive("manage", state.editMode);
                            throw error;
                        });
                    }
                    if (toolbar) toolbar.setActive("manage", state.editMode);
                    return change;
                },'''
          if old not in source:
              raise SystemExit('toggleEdit source contract not found')
          path.write_text(source.replace(old, new, 1))
          PY
          cat > .github/workflows/test.yml <<'YAML'
          name: Test

          on:
            pull_request:
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            test:
              runs-on: ubuntu-latest
              timeout-minutes: 15
              steps:
                - name: Checkout
                  uses: actions/checkout@v7
                - name: Setup Node.js
                  uses: actions/setup-node@v7
                  with:
                    node-version: '24'
                    package-manager-cache: false
                - name: Run test suite
                  run: npm test
          YAML
      - name: Targeted Edit atomic regression
        run: node test/edit-toggle-atomic.test.js
      - name: Run test suite
        run: npm test
      - name: Check diff
        run: git diff --check
      - name: Save verified fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/shared/ui/script-tools.js test/edit-toggle-atomic.test.js .github/workflows/test.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: keep Edit geometry atomic with action DOM"
          git push origin HEAD:fix-edit-atomic-116
