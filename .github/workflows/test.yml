name: Test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ fromJSON(vars.SIRK_RUNNER_LINUX) }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Run test suite
        run: npm test

  windows-interactive-shell-smoke:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ fromJSON(vars.SIRK_RUNNER_WINDOWS) }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate Git installer syntax
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\tools\install\Install-SIRK-Portal-FromGit.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Validate Network Connections shell namespace
        shell: powershell
        run: .\test\windows-network-shell-smoke.ps1
      - name: Validate SMS UTF-8 form encoding
        shell: powershell
        run: .\test\windows-sms-utf8-smoke.ps1
      - name: Validate AD selector bridge
        shell: powershell
        run: .\test\windows-ad-selector-bridge-smoke.ps1
