name: Test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-real-smoke-fixes:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - name: Apply patch
        run: python3 .github/scripts/dev37_patch2.py
      - name: Commit patch
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '4189824+github-actions[bot]@users.noreply.github.com'
          git add server/modules/commands/index.js test/network-command-split.test.js public/shared/ui/shared-ui.css public/shared/ui/toolbar-config.js test/results-viewer-stable-content.test.js
          git commit -m 'fix: follow confirmed network and results smoke evidence'
          git push origin HEAD:${{ github.head_ref }}
