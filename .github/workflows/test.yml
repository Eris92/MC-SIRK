name: Test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepend-version-history:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - name: Prepend dev.36 version history
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'version-history.json';
          const rows = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (!Array.isArray(rows)) throw new Error('version-history.json must be an array.');
          if (rows[0] && rows[0].version === '0.1.1-dev.36') {
            console.log('dev.36 already first; no change.');
            process.exit(0);
          }
          if (rows.some(row => row && row.version === '0.1.1-dev.36')) throw new Error('dev.36 exists but is not first.');
          rows.unshift({
            version: '0.1.1-dev.36',
            date: '2026-08-10',
            changes: [
              'Bump the pre-1.0 development revision so MeshCentral update detection installs the real dev.35 Results stability and Network Settings completion follow-up from PR #245.',
              'Build and theme the final canonical Results parsed/table/Copy/CSV/Debug tree before Modern showModal first paint while keeping cleaned normal output and the untouched full payload only under expandable Debug.',
              'Keep the verified default-route/PIDL Network Settings chain and add SEE_MASK_NOASYNC to ShellExecuteEx (0x0000010C) so the short-lived hidden helper cannot terminate before Shell properties activation completes.',
              'Verify the exact production payload and current scheduled-task/VBS interactive launcher on Windows Server 2025, keep Issues #237 and #128 open for real dev.36 re-smoke, and keep the revision below 1.0.0 with no automatic tag or GitHub Release.'
            ]
          });
          fs.writeFileSync(file, JSON.stringify(rows, null, 2) + '\n', 'utf8');
          JSON.parse(fs.readFileSync(file, 'utf8'));
          NODE
          git diff --check
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add version-history.json
          git commit -m 'docs: prepend dev.36 version history'
          git push origin HEAD:${{ github.head_ref }}

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Run test suite
        run: npm test
