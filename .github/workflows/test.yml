name: Test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Run test suite
        run: npm test

  windows-network-shell-diagnostic:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Probe Network Connections namespace properties invocation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $route = Get-NetRoute -DestinationPrefix '0.0.0.0/0' -ErrorAction SilentlyContinue |
            Where-Object { $_.State -eq 'Alive' } |
            Sort-Object @{ Expression = { ([long]$_.RouteMetric) + ([long]$_.InterfaceMetric) }; Ascending = $true }, InterfaceMetric, RouteMetric, InterfaceIndex |
            Select-Object -First 1
          if (-not $route) { throw 'No live IPv4 default route on runner.' }
          $adapter = Get-NetAdapter -InterfaceIndex $route.InterfaceIndex -ErrorAction Stop
          Write-Host ('adapter=' + $adapter.Name + '; ifIndex=' + $adapter.InterfaceIndex + '; guid=' + $adapter.InterfaceGuid)

          $shell = New-Object -ComObject Shell.Application
          $folder49 = $shell.Namespace(49)
          $folderClsid = $shell.Namespace('::{7007ACC7-3202-11D1-AAD2-00805FC1270E}')
          Write-Host ('namespace49=' + [bool]$folder49 + '; namespaceClsid=' + [bool]$folderClsid)
          $folder = if ($folderClsid) { $folderClsid } else { $folder49 }
          if (-not $folder) { throw 'Network Connections shell folder could not be bound.' }
          Write-Host ('folderSelfPath=' + $folder.Self.Path)

          $items = @($folder.Items())
          $item = $items | Where-Object { $_.Name -eq $adapter.Name } | Select-Object -First 1
          if (-not $item) { throw ('Runner adapter not found in Network Connections: ' + $adapter.Name) }
          Write-Host ('item=' + $item.Name + '; itemPath=' + $item.Path)
          foreach ($verb in @($item.Verbs())) { Write-Host ('verb=' + $verb.Name) }

          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class SirkShellProbe {
              [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Unicode)]
              public struct SHELLEXECUTEINFO {
                  public uint cbSize;
                  public uint fMask;
                  public IntPtr hwnd;
                  [MarshalAs(UnmanagedType.LPWStr)] public string lpVerb;
                  [MarshalAs(UnmanagedType.LPWStr)] public string lpFile;
                  [MarshalAs(UnmanagedType.LPWStr)] public string lpParameters;
                  [MarshalAs(UnmanagedType.LPWStr)] public string lpDirectory;
                  public int nShow;
                  public IntPtr hInstApp;
                  public IntPtr lpIDList;
                  [MarshalAs(UnmanagedType.LPWStr)] public string lpClass;
                  public IntPtr hkeyClass;
                  public uint dwHotKey;
                  public IntPtr hIcon;
                  public IntPtr hProcess;
              }
              [DllImport("shell32.dll", CharSet = CharSet.Unicode, SetLastError = true)]
              static extern bool ShellExecuteEx(ref SHELLEXECUTEINFO info);
              public static int ShowProperties(string path) {
                  var info = new SHELLEXECUTEINFO();
                  info.cbSize = (uint)Marshal.SizeOf(info);
                  info.fMask = 0x0000000C;
                  info.lpVerb = "properties";
                  info.lpFile = path;
                  info.nShow = 1;
                  return ShellExecuteEx(ref info) ? 0 : Marshal.GetLastWin32Error();
              }
          }
          '@

          $parent = [string]$folder.Self.Path
          $leaf = [string]$item.Path
          $candidates = @(
            ($parent + '\' + $leaf),
            ('::{7007ACC7-3202-11D1-AAD2-00805FC1270E}\::' + $leaf),
            ('shell:::{7007ACC7-3202-11D1-AAD2-00805FC1270E}\::' + $leaf),
            ('::{7007ACC7-3202-11D1-AAD2-00805FC1270E}\' + $leaf)
          ) | Select-Object -Unique
          $success = $false
          foreach ($candidate in $candidates) {
            $errorCode = [SirkShellProbe]::ShowProperties($candidate)
            Write-Host ('candidate=' + $candidate + '; shellExecuteError=' + $errorCode)
            if ($errorCode -eq 0) { $success = $true; break }
          }
          if (-not $success) { throw 'No fully qualified Network Connection parsing name accepted the properties verb.' }
