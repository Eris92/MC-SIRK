name: Test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-real-smoke-fixes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - name: Apply confirmed dev.36 root-cause fixes
        run: |
          node <<'NODE'
          const fs = require('fs');

          function replaceOnce(text, pattern, replacement, label) {
            const next = text.replace(pattern, replacement);
            if (next === text) throw new Error('Patch target not found: ' + label);
            return next;
          }

          // #128 — use only routes whose mapped adapter is operational and execute
          // the real Shell FolderItem Properties verb proven on the user's host.
          const serverFile = 'server/modules/commands/index.js';
          let server = fs.readFileSync(serverFile, 'utf8');
          const marker = '{ id: "network-adapter-properties"';
          const start = server.indexOf(marker);
          const end = server.indexOf('\n                { id: "dns"', start);
          if (start < 0 || end < 0) throw new Error('Network Settings command block not found.');
          let block = server.slice(start, end);

          block = replaceOnce(
            block,
            /\$route=Get-NetRoute -DestinationPrefix '0\.0\.0\.0\/0'[\s\S]*?\$adapter=Get-NetAdapter -InterfaceIndex \$route\.InterfaceIndex -ErrorAction Stop;/,
            "$pickRoute={param($prefix) Get-NetRoute -DestinationPrefix $prefix -ErrorAction SilentlyContinue|Where-Object{$_.State -eq 'Alive'}|ForEach-Object{$routeCandidate=$_;$adapterCandidate=Get-NetAdapter -InterfaceIndex $routeCandidate.InterfaceIndex -ErrorAction SilentlyContinue;if($adapterCandidate -and $adapterCandidate.Status -eq 'Up'){[PSCustomObject]@{Route=$routeCandidate;Adapter=$adapterCandidate}}}|Sort-Object @{Expression={([long]$_.Route.RouteMetric)+([long]$_.Route.InterfaceMetric)};Ascending=$true},@{Expression={$_.Route.InterfaceMetric};Ascending=$true},@{Expression={$_.Route.RouteMetric};Ascending=$true},@{Expression={$_.Route.InterfaceIndex};Ascending=$true}|Select-Object -First 1};$selected=&$pickRoute '0.0.0.0/0';if(-not $selected){$selected=&$pickRoute '::/0'};if(-not $selected){throw 'No active default route with an Up adapter was found.'};$route=$selected.Route;$adapter=$selected.Adapter;",
            'operational adapter route selection'
          );

          block = replaceOnce(
            block,
            /\$source=\[Text\.Encoding\]::UTF8\.GetString\(\[Convert\]::FromBase64String\('[A-Za-z0-9+/=]+'\)\);Add-Type -TypeDefinition \$source -ErrorAction Stop;\[SirkNetworkShell\]::ShowProperties\(\$item\)/,
            "$verbs=@($item.Verbs());$verb=$verbs|Where-Object{$name=($_.Name -replace '&','').Trim();$name -match '^(Properties|Właściwości)$'}|Select-Object -First 1;if(-not $verb){throw ('Properties/Właściwości verb was not found for network connection: '+$adapter.Name)};$verb.DoIt()",
            'FolderItemVerb properties execution'
          );
          server = server.slice(0, start) + block + server.slice(end);
          fs.writeFileSync(serverFile, server, 'utf8');

          const networkTestFile = 'test/network-command-split.test.js';
          let networkTest = fs.readFileSync(networkTestFile, 'utf8');
          networkTest = replaceOnce(
            networkTest,
            /assert\.ok\(properties\.indexOf\("DestinationPrefix '0\.0\.0\.0\/0'"\)[\s\S]*?assert\.ok\(interop\.indexOf\('CoTaskMemFree\(pidl\)'\)[\s\S]*?"Shell interop must free the PIDL and surface a ShellExecuteEx failure instead of silently falling back\."\);/,
            `assert.ok(properties.indexOf('$pickRoute={param($prefix)') >= 0 &&\n    properties.indexOf("$selected=&$pickRoute '0.0.0.0/0'") >= 0 &&\n    properties.indexOf("$selected=&$pickRoute '::/0'") >= 0,\n    "Adapter properties must prefer IPv4 operational-route candidates and use IPv6 only as fallback.");\nassert.ok(properties.indexOf('Get-NetAdapter -InterfaceIndex $routeCandidate.InterfaceIndex -ErrorAction SilentlyContinue') >= 0 &&\n    properties.indexOf("$adapterCandidate.Status -eq 'Up'") >= 0,\n    "Every default-route candidate must map to a live adapter with Status=Up before it can be selected.");\nassert.ok(properties.indexOf('([long]$_.Route.RouteMetric)+([long]$_.Route.InterfaceMetric)') >= 0 &&\n    properties.indexOf('$_.Route.InterfaceMetric') >= 0 &&\n    properties.indexOf('$_.Route.RouteMetric') >= 0 &&\n    properties.indexOf('$_.Route.InterfaceIndex') >= 0,\n    "Operational default-route selection must remain deterministic by route + interface metric with InterfaceIndex tie-break.");\nassert.ok(properties.indexOf('$route=$selected.Route;$adapter=$selected.Adapter') >= 0,\n    "The selected route and already-validated Up adapter must stay paired.");\nassert.ok(properties.indexOf('$shell.Namespace(49)') >= 0 &&\n    properties.indexOf("$item=$folder.Items()|Where-Object{$_.Name -eq $adapter.Name}|Select-Object -First 1") >= 0,\n    "Adapter properties must enumerate Network Connections and resolve the exact selected Up adapter item.");\nassert.ok(properties.indexOf('$verbs=@($item.Verbs())') >= 0 &&\n    properties.indexOf("($_.Name -replace '&','').Trim()") >= 0 &&\n    properties.indexOf("'^(Properties|Właściwości)$'") >= 0 &&\n    properties.indexOf('$verb.DoIt()') >= 0,\n    "Network Settings must execute the actual Properties/Właściwości FolderItemVerb proven on the real Windows host.");\nassert.strictEqual(properties.indexOf("$item.InvokeVerb('properties')"), -1,\n    "The locale-sensitive direct InvokeVerb path must not return.");\nassert.strictEqual(properties.indexOf('ShellExecuteEx'), -1,\n    "ShellExecuteEx false-success path from dev.36 must not return.");\nassert.strictEqual(properties.indexOf('SHGetIDListFromObject'), -1,\n    "The obsolete PIDL interop path must not return once the real FolderItem verb owns execution.");\nassert.strictEqual(properties.indexOf('FromBase64String'), -1,\n    "Network Settings must not carry the removed embedded C# Shell interop payload.");\nassert.strictEqual(properties.indexOf('Add-Type -TypeDefinition'), -1,\n    "Network Settings must not compile a Shell interop helper after the native FolderItem verb path is proven.");\nassert.strictEqual(properties.indexOf("$shell.Namespace('shell:ConnectionsFolder')"), -1,\n    "The ineffective dev.33 shell:ConnectionsFolder NameSpace input must not return.");\nassert.strictEqual(properties.indexOf('$shell.Namespace(3)'), -1,\n    "Adapter properties must never enumerate Shell special folder 3 because it is Control Panel, not Network Connections.");\nassert.ok(properties.indexOf("throw 'No active default route with an Up adapter was found.'") >= 0,\n    "No operational default route must be a controlled error, not a disconnected-adapter fallback.");\nassert.strictEqual(properties.indexOf('Start-Sleep'), -1,\n    "Adapter properties must not depend on a fixed UI delay.");\nassert.strictEqual(properties.indexOf('control.exe ncpa.cpl'), -1,\n    "Showing Network Connections alone must not count as adapter-properties success.");`,
            'network regression contract'
          );
          fs.writeFileSync(networkTestFile, networkTest, 'utf8');

          // #237 — the native MeshCentral modal owns outer surface and geometry.
          const cssFile = 'public/shared/ui/shared-ui.css';
          let css = fs.readFileSync(cssFile, 'utf8');
          css = replaceOnce(
            css,
            /.mc-results-viewer-overlay\{position:fixed;inset:0;z-index:10050;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba\(0,0,0,.58\)\}\.mc-results-viewer\{width:min\(1200px,96vw\);max-height:92vh;display:flex;flex-direction:column;box-sizing:border-box;color:inherit\}/,
            '.mc-results-viewer{min-width:0;min-height:0;width:100%;box-sizing:border-box;color:inherit}',
            'native Results modal content geometry'
          );
          css = css.replace('.mc-results-viewer-overlay{padding:8px}', '');
          fs.writeFileSync(cssFile, css, 'utf8');

          const themeFile = 'public/shared/ui/toolbar-config.js';
          let theme = fs.readFileSync(themeFile, 'utf8');
          theme = replaceOnce(
            theme,
            ',.mc-move-dialog,.mc-results-viewer", applyCard);',
            ',.mc-move-dialog", applyCard);',
            'Results root card ownership'
          );
          fs.writeFileSync(themeFile, theme, 'utf8');

          const resultsTestFile = 'test/results-viewer-stable-content.test.js';
          let resultsTest = fs.readFileSync(resultsTestFile, 'utf8');
          resultsTest = replaceOnce(
            resultsTest,
            'var source = fs.readFileSync(path.join(root, "public/shared/ui/results.js"), "utf8");',
            'var source = fs.readFileSync(path.join(root, "public/shared/ui/results.js"), "utf8");\nvar css = fs.readFileSync(path.join(root, "public/shared/ui/shared-ui.css"), "utf8");\nvar themeSource = fs.readFileSync(path.join(root, "public/shared/ui/toolbar-config.js"), "utf8");',
            'Results geometry test inputs'
          );
          resultsTest = replaceOnce(
            resultsTest,
            'console.log("Results viewer first paint is final, structured output is tabular and Debug preserves full raw output: OK");',
            `var viewerRule = /\\.mc-results-viewer\\{([^}]*)\\}/.exec(css);\nassert.ok(viewerRule, "Results viewer content root geometry rule must exist.");\nassert.ok(viewerRule[1].indexOf('width:100%') >= 0,\n    "Native modal content root must fill the host body instead of owning a second viewport-sized surface.");\n['96vw', '92vh', 'max-height:92vh', 'display:flex', 'flex-direction:column'].forEach(function (fragment) {\n    assert.strictEqual(viewerRule[1].indexOf(fragment), -1,\n        "Native Results modal content root must not retain standalone viewer geometry: " + fragment);\n});\nassert.strictEqual(css.indexOf('.mc-results-viewer-overlay{'), -1,\n    "Removed plugin-owned Results overlay CSS must not return once MeshCentral owns the modal.");\nvar applyCardLine = themeSource.split('\\n').filter(function (line) { return line.indexOf('applyCard);') >= 0 && line.indexOf('.mc-move-dialog') >= 0; })[0] || '';\nassert.strictEqual(applyCardLine.indexOf('.mc-results-viewer'), -1,\n    "MeshThemeAdapter must not turn the Results content root into a second card/surface inside the native modal.");\nassert.ok(themeSource.indexOf('PLUGIN_ROOT_SELECTOR') >= 0 && themeSource.indexOf('.mc-results-viewer') >= 0,\n    "Results must remain a plugin root so native controls/tables inside it still receive shared theme ownership.");\n\nconsole.log("Results viewer first paint is final, structured output is tabular, Debug preserves full raw output and native modal owns outer geometry: OK");`,
            'Results geometry regression assertions'
          );
          fs.writeFileSync(resultsTestFile, resultsTest, 'utf8');
          NODE
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/modules/commands/index.js test/network-command-split.test.js public/shared/ui/shared-ui.css public/shared/ui/toolbar-config.js test/results-viewer-stable-content.test.js
          git commit -m 'fix: follow real network and results smoke evidence'
          git push origin HEAD:${{ github.head_ref }}
