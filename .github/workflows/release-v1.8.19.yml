name: Release SIRK 1.8.19

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-sirk-v1.8.19
  cancel-in-progress: true

jobs:
  release:
    if: github.event.pull_request.head.ref == 'release/trigger-v1.8.19'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_SHA: c4711f7b3401681dcfa429a13f63419d416d9ba9
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify release commit and metadata
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$RELEASE_SHA^{commit}"
          test "$(git show "$RELEASE_SHA:config.json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).version))")" = "1.8.19"
          test "$(git show "$RELEASE_SHA:package.json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).version))")" = "1.8.19"
          test -f server/core/audit-log.js
          test -f server/core/runtime-base.js
          test -f test/ui-regression-1.8.19.test.js
          git diff --check "$RELEASE_SHA^" "$RELEASE_SHA"

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check server/core/audit-log.js
          node --check server/core/runtime.js
          node --check server/core/runtime-base.js
          node --check public/shared/ui/tabs.js
          node --check test/ui-regression-1.8.19.test.js

      - name: Run full test suite
        run: npm test

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin refs/tags/v1.8.19 >/dev/null 2>&1; then
            existing="$(git ls-remote --tags origin refs/tags/v1.8.19^{} | awk '{print $1}')"
            if [ -z "$existing" ]; then existing="$(git ls-remote --tags origin refs/tags/v1.8.19 | awk '{print $1}')"; fi
            test "$existing" = "$RELEASE_SHA"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a v1.8.19 "$RELEASE_SHA" -m "SIRK Management Platform 1.8.19"
            git push origin refs/tags/v1.8.19
          fi
          if ! gh release view v1.8.19 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create v1.8.19 --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" --title "SIRK Management Platform 1.8.19" --latest --notes "$(cat <<'EOF'
## SIRK Management Platform 1.8.19

- lekkie, kumulacyjne wcięcie 6 px w drugiej kolumnie Quick i wspólnych drzewach,
- semantyczne kolory ikon Commands oraz nowa ikona koła zębatego dla System,
- polecenie otwierające ustawienia aktywnej karty sieciowej,
- przywrócone akcje Edit i Multi-device wraz z obsługą wbudowanych poleceń,
- naprawiony kolumnowy układ panelu administracyjnego,
- identyczny kolor ikony i tekstu statusu,
- zakładka General z trybem ikon Auto / Classic / Modern,
- trwały, redacted audit log dla akceptacji, Commands, My Scripts i wyników agenta.
EOF
)"
          fi

      - name: Remove one-time workflow and close trigger PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git checkout main
          git pull --ff-only origin main
          git rm .github/workflows/release-v1.8.19.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove one-time 1.8.19 release workflow"
          git push origin main
          gh pr close "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --comment "SIRK Management Platform 1.8.19 został przetestowany i opublikowany."
