name: Publish SIRK 1.8.20

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: publish-sirk-v1.8.20
  cancel-in-progress: true

jobs:
  release:
    if: github.event.pull_request.head.ref == 'release/publish-v1.8.20'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_SHA: 483fbe631a8a62495c72ade139932778aa3fa9a9
      RELEASE_TAG: v1.8.20
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify release target
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$RELEASE_SHA^{commit}"
          test "$(git show "$RELEASE_SHA:config.json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).version))")" = "1.8.20"
          test "$(git show "$RELEASE_SHA:package.json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).version))")" = "1.8.20"
          test -f docs/releases/1.8.20.md

      - name: Run full test suite
        run: npm test

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            existing="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG^{}" | awk '{print $1}')"
            if [ -z "$existing" ]; then existing="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | awk '{print $1}')"; fi
            test "$existing" = "$RELEASE_SHA"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" "$RELEASE_SHA" -m "SIRK Management Platform 1.8.20"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_SHA" \
              --title "SIRK Management Platform 1.8.20" \
              --latest \
              --notes-file docs/releases/1.8.20.md
          fi
