name: Validate runtime smoke follow-up v2
on:
  push:
    branches:
      - runtime-smoke-followup-155-128-150-149-163
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: runtime-smoke-followup-155-128-150-149-163
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Apply runtime smoke follow-up
        shell: bash
        run: |
          git show HEAD^:.github/workflows/validate-runtime-smoke-followup.yml | sed -n "/python3 - <<'PY'/,/^          PY$/p" | sed '1d;$d;s/^          //' > /tmp/apply.py
          python3 /tmp/apply.py
      - name: Remove temporary workflow before validation
        run: rm .github/workflows/validate-runtime-smoke-followup.yml
      - name: Targeted regression tests
        run: |
          node test/stable-first-column-icon-size.test.js
          node test/results-table-readability.test.js
          node test/command-label-contract.test.js
          node test/command-legacy-default-override.test.js
          node test/network-command-split.test.js
          node test/move-request-submit-feedback.test.js
          node test/move-request-human-readable-summary.test.js
          node test/approval-selected-state.test.js
      - name: Full test suite
        run: npm test
      - name: Diff check
        run: git diff --check
      - name: Save verified follow-up
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: address runtime smoke follow-up"
          git push origin HEAD:runtime-smoke-followup-155-128-150-149-163
