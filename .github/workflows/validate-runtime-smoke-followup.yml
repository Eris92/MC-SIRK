name: Validate runtime smoke follow-up
on:
  push:
    branches: [runtime-smoke-followup-155-128-150-149-163]
    paths:
      - '.github/workflows/validate-runtime-smoke-followup.yml'
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: runtime-smoke-followup-155-128-150-149-163
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Apply runtime smoke follow-up
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing replacement target in {path}: {old[:100]}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # #155: preserve vertical row origin and row step as well as icon size.
          replace(
              'public/shared/ui/toolbar.css',
              '.mc-shared-layout.is-collapsed .mc-shared-primary>.sirk-shared-list-item,.sirk-quick-command-browser.is-collapsed .mc-shared-primary>button{display:flex;align-items:center;justify-content:center;width:48px;min-width:48px;height:42px;min-height:42px;margin:0 auto 3px;padding:6px;font-size:0}',
              '.mc-shared-layout.is-collapsed .mc-shared-primary>.sirk-shared-list-item,.sirk-quick-command-browser.is-collapsed .mc-shared-primary>button{display:flex;align-items:center;justify-content:center;width:48px;min-width:48px;height:44px;min-height:44px;margin:0 auto 3px;padding:8px;font-size:0}'
          )
          replace(
              'public/shared/ui/shared-ui.css',
              '.mc-shared-layout.is-collapsed .mc-shared-primary{padding:8px 6px;overflow:hidden}',
              '.mc-shared-layout.is-collapsed .mc-shared-primary{padding:12px 6px;overflow:hidden}'
          )

          # #149: a long unbroken technical token must stay inside a semantic text cell.
          replace(
              'public/shared/ui/shared-ui.css',
              '.mc-results-table .mc-results-col-text{min-width:210px;width:280px;max-width:420px;white-space:normal;word-break:normal;overflow-wrap:normal}',
              '.mc-results-table .mc-results-col-text{min-width:210px;width:280px;max-width:420px;white-space:normal;word-break:normal;overflow-wrap:anywhere}'
          )

          # #128/#150: ignore only persisted labels that were historical built-in defaults.
          commands = Path('server/modules/commands/index.js')
          text = commands.read_text(encoding='utf-8')
          old = '''    function commandOverrides() { return (context.settings.read().modules.mycommands || {}).commandOverrides || {}; }\n    function effectiveCommand(command, categoryKey) {\n        var override = commandOverrides()[command.id] || {};\n        var result = shared.copy(command);\n        if (override.label) result.label = shared.cleanText(override.label, 200);\n'''
          new = '''    var legacyDefaultLabels = {\n        "network-settings": ["Network Connections", "Panel Sieciowy"],\n        "network-adapter-properties": ["Network Adapter Properties", "Właściwości Sieciowe"],\n        powershell: ["Open PowerShell", "Otwórz PowerShell"],\n        cmd: ["Open CMD", "Otwórz CMD"]\n    };\n    function commandOverrides() { return (context.settings.read().modules.mycommands || {}).commandOverrides || {}; }\n    function effectiveCommand(command, categoryKey) {\n        var override = commandOverrides()[command.id] || {};\n        var result = shared.copy(command);\n        var overrideLabel = shared.cleanText(override.label, 200);\n        var obsoleteDefaults = legacyDefaultLabels[command.id] || [];\n        if (overrideLabel && obsoleteDefaults.indexOf(overrideLabel) < 0) result.label = overrideLabel;\n'''
          if old not in text:
              raise SystemExit('missing effectiveCommand target')
          commands.write_text(text.replace(old, new, 1), encoding='utf-8')

          # #163: resolve group names from the existing visible mesh list; IDs remain execution identity.
          move_server = Path('server/modules/move-requests/index.js')
          text = move_server.read_text(encoding='utf-8')
          old = '''    function normalizeLevelList(value) {\n'''
          new = '''    function meshNameMap(user) {\n        var result = Object.create(null);\n        meshRows(user).forEach(function (mesh) { result[String(mesh.id)] = mesh.name; });\n        return result;\n    }\n\n    function normalizeLevelList(value) {\n'''
          if old not in text:
              raise SystemExit('missing move mesh helper insertion target')
          text = text.replace(old, new, 1)
          old = '''        normalizePayload: function (payload) {\n            payload = payload || {};\n            return {\n                nodeId: shared.cleanText(payload.nodeId, 300),\n                nodeName: shared.cleanText(payload.nodeName, 300),\n                sourceMeshId: shared.cleanText(payload.sourceMeshId, 300),\n                sourceMeshName: shared.cleanText(payload.sourceMeshName, 300),\n                targetMeshId: shared.cleanText(payload.targetMeshId, 300),\n                targetMeshName: shared.cleanText(payload.targetMeshName, 300)\n            };\n        },\n'''
          new = '''        normalizePayload: function (payload, user) {\n            payload = payload || {};\n            var sourceMeshId = shared.cleanText(payload.sourceMeshId, 300);\n            var targetMeshId = shared.cleanText(payload.targetMeshId, 300);\n            var names = meshNameMap(user);\n            return {\n                nodeId: shared.cleanText(payload.nodeId, 300),\n                nodeName: shared.cleanText(payload.nodeName, 300),\n                sourceMeshId: sourceMeshId,\n                sourceMeshName: sourceMeshId ? (names[sourceMeshId] || "") : shared.cleanText(payload.sourceMeshName, 300),\n                targetMeshId: targetMeshId,\n                targetMeshName: targetMeshId ? (names[targetMeshId] || "") : shared.cleanText(payload.targetMeshName, 300)\n            };\n        },\n        presentRequest: function (user, request) {\n            request = shared.copy(request || {});\n            var payload = request.payload || {};\n            var names = meshNameMap(user);\n            var sourceMeshId = String(payload.sourceMeshId || "");\n            var targetMeshId = String(payload.targetMeshId || "");\n            var source = sourceMeshId ? (names[sourceMeshId] || sourceMeshId) : (payload.sourceMeshName || "Current group");\n            var target = targetMeshId ? (names[targetMeshId] || targetMeshId) : (payload.targetMeshName || "");\n            if (source || target) request.summary = source + " → " + target;\n            return request;\n        },\n'''
          if old not in text:
              raise SystemExit('missing move normalize target')
          move_server.write_text(text.replace(old, new, 1), encoding='utf-8')

          approval = Path('server/core/approval-service.js')
          text = approval.read_text(encoding='utf-8')
          old = '''    function publicRequest(user, request) {\n        var result = shared.copy(request);\n        delete result.payload;\n        result.canDecide = canDecide(user, request);\n'''
          new = '''    function publicRequest(user, request) {\n        var result = shared.copy(request);\n        var provider = providers[String(result.type || "").toLowerCase()];\n        if (provider && typeof provider.presentRequest === "function") {\n            var presented = provider.presentRequest(user, result);\n            if (presented && typeof presented === "object" && !Array.isArray(presented)) result = presented;\n        }\n        delete result.payload;\n        result.canDecide = canDecide(user, request);\n'''
          if old not in text:
              raise SystemExit('missing approval publicRequest target')
          approval.write_text(text.replace(old, new, 1), encoding='utf-8')

          move_client = Path('public/modules/move-requests/index.js')
          text = move_client.read_text(encoding='utf-8')
          old = '''            var select = document.createElement("select");\n            select.className = "mc-move-dialog-input";\n            var sourceMeshId = currentMeshId(nodeId);\n\n            (result.meshes || [])\n'''
          new = '''            var select = document.createElement("select");\n            select.className = "mc-move-dialog-input";\n            var sourceMeshId = currentMeshId(nodeId);\n            var sourceMesh = (result.meshes || []).filter(function (mesh) { return String(mesh.id) === sourceMeshId; })[0];\n            var sourceMeshName = sourceMesh && sourceMesh.name || "";\n\n            (result.meshes || [])\n'''
          if old not in text:
              raise SystemExit('missing move client source target')
          text = text.replace(old, new, 1)
          old = '''                    sourceMeshId: sourceMeshId,\n                    targetMeshId: option.value,\n'''
          new = '''                    sourceMeshId: sourceMeshId,\n                    sourceMeshName: sourceMeshName,\n                    targetMeshId: option.value,\n'''
          if old not in text:
              raise SystemExit('missing move client payload target')
          move_client.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Extend existing regressions with the runtime failures seen in real MeshCentral.
          stable = Path('test/stable-first-column-icon-size.test.js')
          text = stable.read_text(encoding='utf-8')
          old = '''assert.ok(toolbar.indexOf('.mc-shared-primary>.sirk-shared-list-item .sirk-shared-list-icon svg,.sirk-quick-command-browser .mc-shared-primary>button .sirk-quick-command-icon svg{width:24px;height:24px}') >= 0,\n    "Monochrome first-column SVG artwork must stay 24x24 in every Collapse state.");\n\n'''
          new = old + '''assert.ok(toolbar.indexOf('.mc-shared-layout.is-collapsed .mc-shared-primary>.sirk-shared-list-item,.sirk-quick-command-browser.is-collapsed .mc-shared-primary>button{display:flex;align-items:center;justify-content:center;width:48px;min-width:48px;height:44px;min-height:44px;margin:0 auto 3px;padding:8px;font-size:0}') >= 0,\n    "Collapsed first-column rows must keep the same 44 px vertical step as expanded 28 px icons with 8 px padding.");\nassert.ok(shared.indexOf('.mc-shared-layout.is-collapsed .mc-shared-primary{padding:12px 6px;overflow:hidden}') >= 0,\n    "Collapse must preserve the expanded primary column's 12 px vertical origin while only tightening horizontal padding.");\n\n'''
          if old not in text:
              raise SystemExit('missing stable test target')
          stable.write_text(text.replace(old, new, 1), encoding='utf-8')

          readability = Path('test/results-table-readability.test.js')
          text = readability.read_text(encoding='utf-8')
          old = '''assert.ok(css.indexOf('.mc-results-table .mc-results-col-text{min-width:210px;width:280px;max-width:420px;white-space:normal;word-break:normal;overflow-wrap:normal}') >= 0,\n    "Request/Summary/Command/Script/Device text must wrap normally only after a readable minimum.");\n'''
          new = '''assert.ok(css.indexOf('.mc-results-table .mc-results-col-text{min-width:210px;width:280px;max-width:420px;white-space:normal;word-break:normal;overflow-wrap:anywhere}') >= 0,\n    "Semantic text columns must contain long unbroken IDs/tokens without painting across View/Actions cells.");\n'''
          if old not in text:
              raise SystemExit('missing results test target')
          readability.write_text(text.replace(old, new, 1), encoding='utf-8')

          Path('test/command-legacy-default-override.test.js').write_text(r'''"use strict";

var assert = require("assert");
var fs = require("fs");
var os = require("os");
var path = require("path");
var factory = require("../server/modules/commands/index.js");

var repo = path.resolve(__dirname, "..");
var dataRoot = fs.mkdtempSync(path.join(os.tmpdir(), "mc-sirk-command-label-"));
var current = {
    modules: {
        mycommands: {
            accessGroupIds: [], folderPermissions: {}, scriptAvailability: {},
            commandOverrides: {
                "network-settings": { label: "Network Connections" },
                "network-adapter-properties": { label: "Właściwości Sieciowe" },
                powershell: { label: "Open PowerShell" },
                cmd: { label: "Otwórz CMD" },
                regedit: { label: "Registry Custom" }
            }
        }
    }
};
var context = {
    fs: fs, path: path, pluginRoot: repo, dataRoot: dataRoot,
    parent: {},
    settings: {
        read: function () { return current; },
        updateSync: function (fn) { current = fn(current) || current; return current; },
        update: function (fn) { current = fn(current) || current; return Promise.resolve(current); }
    },
    secrets: { get: function () { return {}; }, set: function () {} },
    integrations: { configured: function () { return {}; }, readSettings: function () { return {}; } },
    approval: { registerProvider: function () { return function () {}; } },
    device: {}
};

var module = factory.createModule(context);
var user = { _id: "user/admin", siteadmin: true };
var catalog = module.apiGet("catalog", { query: {} }, user).catalog;
function command(id) {
    var found;
    catalog.forEach(function (category) {
        (category.commands || []).forEach(function (item) { if (item.id === id) found = item; });
    });
    return found;
}

assert.strictEqual(command("network-settings").label, "Network Control",
    "Persisted historical Network Connections default must not override the new canonical label.");
assert.strictEqual(command("network-adapter-properties").label, "Network Settings",
    "Persisted historical adapter-properties default must not override the new canonical label.");
assert.strictEqual(command("powershell").label, "PowerShell",
    "Persisted historical Open PowerShell default must not survive runtime catalog generation.");
assert.strictEqual(command("cmd").label, "CMD",
    "Persisted historical Open/Otwórz CMD default must not survive runtime catalog generation.");
assert.strictEqual(command("regedit").label, "Registry Custom",
    "A genuine user-defined command label must remain an override.");

current.modules.mycommands.commandOverrides["network-settings"].label = "My Network Launcher";
catalog = module.apiGet("catalog", { query: {} }, user).catalog;
assert.strictEqual(command("network-settings").label, "My Network Launcher",
    "Only known historical defaults may be ignored; arbitrary custom labels must be preserved.");

fs.rmSync(dataRoot, { recursive: true, force: true });
console.log("Legacy built-in default labels are normalized without deleting genuine command overrides: OK");
''', encoding='utf-8')

          Path('test/move-request-human-readable-summary.test.js').write_text(r'''"use strict";

var assert = require("assert");
var fs = require("fs");
var os = require("os");
var path = require("path");
var approvalFactory = require("../server/core/approval-service.js");
var moveFactory = require("../server/modules/move-requests/index.js");

var dataRoot = fs.mkdtempSync(path.join(os.tmpdir(), "mc-sirk-move-summary-"));
var current = {
    modules: {
        approvals: { providers: { moverequests: { enabled: true, showTab: true, showOverview: true, levels: {} } } },
        moverequests: { enabled: true, targetMeshApprovalLevels: {} }
    }
};
var visibleMeshes = {};
var settings = {
    read: function () { return current; },
    isModuleEnabled: function () { return true; },
    update: function (fn) { current = fn(current) || current; return Promise.resolve(current); },
    updateSync: function (fn) { current = fn(current) || current; return current; }
};
var context = {
    fs: fs, path: path, dataRoot: dataRoot, settings: settings,
    parent: {}, source: "test",
    device: {
        visibleMeshes: function () { return visibleMeshes; },
        visibleNodes: function () { return { nodes: [], meshes: [] }; },
        getWebServer: function () { return null; }
    }
};
context.approval = approvalFactory.createApprovalService({
    fs: fs, path: path, parent: {}, source: "test", settings: settings,
    databasePath: path.join(dataRoot, "requests.json"),
    fallbackDatabasePath: path.join(dataRoot, "approval-requests.json")
});
var move = moveFactory.createModule(context);
var user = { _id: "user/admin", name: "Admin", siteadmin: true };

Promise.resolve(move.initialize())
    .then(function () {
        return context.approval.submit("moverequests", user, {
            nodeId: "node/domain/host-1", nodeName: "HOST-1",
            sourceMeshId: "mesh/domain/source", targetMeshId: "mesh/domain/target"
        }, "");
    })
    .then(function (created) {
        assert.strictEqual(created.summary, "mesh/domain/source → mesh/domain/target",
            "Without visible names the stored/display fallback must remain the stable IDs.");
        visibleMeshes = {
            "mesh/domain/source": { _id: "mesh/domain/source", name: "Production" },
            "mesh/domain/target": { _id: "mesh/domain/target", name: "VIP" }
        };
        return context.approval.list(user, { type: "moverequests", page: 1, perPage: 50 });
    })
    .then(function (listed) {
        assert.strictEqual(listed.rows[0].summary, "Production → VIP",
            "Existing ID-only requests must be presented with current visible mesh names without rewriting execution IDs.");
        assert.strictEqual(Object.prototype.hasOwnProperty.call(listed.rows[0], "payload"), false,
            "Presentation enrichment must not leak the private execution payload.");
        visibleMeshes = {
            "mesh/domain/target": { _id: "mesh/domain/target", name: "VIP" }
        };
        return context.approval.list(user, { type: "moverequests", page: 1, perPage: 50 });
    })
    .then(function (listed) {
        assert.strictEqual(listed.rows[0].summary, "mesh/domain/source → VIP",
            "An invisible mesh name must not be exposed; presentation must fall back to its ID.");
        visibleMeshes = {
            "mesh/domain/source": { _id: "mesh/domain/source", name: "Production" },
            "mesh/domain/target": { _id: "mesh/domain/target", name: "VIP" }
        };
        return context.approval.submit("moverequests", user, {
            nodeId: "node/domain/host-2", nodeName: "HOST-2",
            sourceMeshId: "mesh/domain/source", sourceMeshName: "Spoofed Source",
            targetMeshId: "mesh/domain/target", targetMeshName: "Spoofed Target"
        }, "");
    })
    .then(function (created) {
        assert.strictEqual(created.title, "Move HOST-2", "Human-readable nodeName must remain the request title display metadata.");
        assert.strictEqual(created.summary, "Production → VIP",
            "Server-visible mesh names must win over client-supplied display names.");
        assert.strictEqual(created.payload.sourceMeshId, "mesh/domain/source");
        assert.strictEqual(created.payload.targetMeshId, "mesh/domain/target");
        fs.rmSync(dataRoot, { recursive: true, force: true });
        console.log("Move Requests present human-readable visible mesh names while preserving stable execution IDs: OK");
    })
    .catch(function (error) {
        fs.rmSync(dataRoot, { recursive: true, force: true });
        console.error(error);
        process.exitCode = 1;
    });
''', encoding='utf-8')

          # Client submit must reuse the mesh list it already loaded rather than adding another request.
          submit_test = Path('test/move-request-submit-feedback.test.js')
          text = submit_test.read_text(encoding='utf-8')
          marker = 'assert.ok(source.indexOf(\'setDialogStatus(status, "completed", "Request sent.")\') >= 0,'
          if marker not in text:
              raise SystemExit('missing move submit test marker')
          insertion = '''assert.ok(source.indexOf('var sourceMeshName = sourceMesh && sourceMesh.name || ""') >= 0 &&\n    source.indexOf('sourceMeshName: sourceMeshName') >= 0,\n    "Move Request submit must reuse the already loaded mesh resources to send human-readable source group metadata.");\n\n'''
          text = text.replace(marker, insertion + marker, 1)
          submit_test.write_text(text, encoding='utf-8')
          PY
      - name: Remove temporary workflow before repository validation
        run: rm .github/workflows/validate-runtime-smoke-followup.yml
      - name: Targeted regression tests
        run: |
          node test/stable-first-column-icon-size.test.js
          node test/results-table-readability.test.js
          node test/command-label-contract.test.js
          node test/command-legacy-default-override.test.js
          node test/network-command-split.test.js
          node test/move-request-submit-feedback.test.js
          node test/move-request-human-readable-summary.test.js
          node test/approval-selected-state.test.js
      - name: Full test suite
        run: npm test
      - name: Diff check
        run: git diff --check
      - name: Save verified follow-up
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: address runtime smoke follow-up"
          git push origin HEAD:runtime-smoke-followup-155-128-150-149-163
