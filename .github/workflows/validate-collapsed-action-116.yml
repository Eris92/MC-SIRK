name: Validate collapsed action geometry 116

on:
  push:
    branches: [fix-collapsed-action-geometry-116]
    paths:
      - '.github/workflows/validate-collapsed-action-116.yml'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: fix-collapsed-action-geometry-116
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Apply collapsed action geometry fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          css = Path('public/shared/ui/shared-ui.css')
          text = css.read_text()
          old = '.mc-shared-layout.is-collapsed{grid-template-columns:var(--sirk-primary-collapsed-track) var(--sirk-shared-secondary-track) var(--sirk-shared-details-track)!important}'
          new = '.mc-shared-layout.is-collapsed{grid-template-columns:var(--sirk-primary-collapsed-track) var(--sirk-shared-secondary-track) var(--sirk-shared-details-track)}'
          if old not in text:
              raise SystemExit('collapsed shared layout !important fragment not found')
          css.write_text(text.replace(old, new, 1))

          test = Path('test/shared-column-alignment.test.js')
          text = test.read_text()
          old = '''assert.ok(sharedCss.indexOf("grid-template-columns:var(--sirk-primary-collapsed-track) var(--sirk-shared-secondary-track) var(--sirk-shared-details-track)!important") >= 0,\n    "Collapsed modules must preserve the same second and third tracks after the 64 px primary track.");'''
          new = '''assert.ok(sharedCss.indexOf(".mc-shared-layout.is-collapsed{grid-template-columns:var(--sirk-primary-collapsed-track) var(--sirk-shared-secondary-track) var(--sirk-shared-details-track)}") >= 0,\n    "The base collapsed track must keep the 64 px primary without !important so action modes can override secondary geometry.");\nassert.ok(toolbarCss.indexOf(".mc-shared-page:is(.is-edit-mode,.is-multi-mode) .mc-shared-layout.is-collapsed{grid-template-columns:var(--sirk-primary-collapsed-track) calc(var(--sirk-mode-secondary-width,340px) + var(--sirk-actions-width) + var(--sirk-actions-column-gap)) var(--sirk-edit-details-track)}") >= 0,\n    "Collapsed Edit and Multi must keep their measured action rail outside the captured secondary text track.");'''
          if old not in text:
              raise SystemExit('stale collapsed !important test contract not found')
          test.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/validate-collapsed-action-116.yml
      - name: Targeted collapsed action tests
        run: |
          node test/shared-column-alignment.test.js
          node test/script-mode-layout.test.js
          node test/edit-live-geometry.test.js
          node test/workspace-page-style.test.js
      - name: Run full test suite
        run: npm test
      - name: Check diff
        run: |
          git diff --check
          git status --short
      - name: Save verified fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/shared/ui/shared-ui.css test/shared-column-alignment.test.js .github/workflows/validate-collapsed-action-116.yml
          git commit -m "fix: preserve action geometry when primary is collapsed"
          git push origin HEAD:fix-collapsed-action-geometry-116
