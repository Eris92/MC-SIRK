name: Validate dev.13 metadata bump
on:
  push:
    branches:
      - issue-180-version-dev13
permissions:
  contents: write
jobs:
  bump-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Prepare metadata
        run: node .github/issue-180-bump.js
      - name: Remove temporary helpers
        run: rm .github/issue-180-bump.js .github/workflows/issue-180-bump.yml
      - name: Targeted repository metadata validation
        run: node scripts/validate-repository-layout.js
      - name: Full test suite
        run: npm test
      - name: Diff check
        run: git diff --check
      - name: Commit validated bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: bump development revision to 0.1.1-dev.13"
          git push origin HEAD:issue-180-version-dev13
