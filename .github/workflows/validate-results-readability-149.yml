name: Validate results readability 149

on:
  push:
    branches: [issue-149-results-table-readability]
    paths:
      - '.github/workflows/validate-results-readability-149.yml'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: issue-149-results-table-readability
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Apply shared Results readability contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              p.write_text(text.replace(old, new, 1))

          results = 'public/shared/ui/results.js'
          insert_after = '''    function appendValue(cell, value) {\n        if (value && typeof value === "object" && /^https:\\/\\//i.test(String(value.url || ""))) {\n            var link = document.createElement("a"); link.href = value.url; link.target = "_blank"; link.rel = "noopener"; link.textContent = value.text || "Open"; cell.appendChild(link);\n        } else cell.textContent = value == null ? "" : typeof value === "object" ? JSON.stringify(value) : String(value);\n    }\n'''
          helpers = insert_after + '''\n    function tableWidthClass(columnCount) {\n        if (columnCount >= 7) return "mc-results-table-wide";\n        if (columnCount >= 4) return "mc-results-table-medium";\n        return "mc-results-table-compact";\n    }\n\n    function tableColumnClass(title) {\n        var key = String(title || "").trim().toLowerCase().replace(/\\s+/g, "");\n        if (key === "view" || key === "actions" || key === "action") return "mc-results-col-actions";\n        if (key === "datetime" || key === "date" || key === "time" || key === "status" || key === "approval") return "mc-results-col-short";\n        if (key === "request" || key === "summary" || key === "command" || key === "script" || key === "device" || key === "result") return "mc-results-col-text";\n        if (key === "requester" || key === "approver") return "mc-results-col-medium";\n        return "mc-results-col-default";\n    }\n'''
          replace_once(results, insert_after, helpers, 'Shared Results table helpers')

          replace_once(results,
              '                var table = document.createElement("table"); table.className = "style1 mc-results-table mc-results-structured-table";\n                var header = table.createTHead().insertRow(); columns.forEach(function (column) { var cell = document.createElement("th"); cell.textContent = column; header.appendChild(cell); });\n                var body = table.createTBody(); visible.forEach(function (source) { var row = body.insertRow(); columns.forEach(function (column) { appendValue(row.insertCell(), source && source[column]); }); });',
              '                var table = document.createElement("table"); table.className = "style1 mc-results-table mc-results-structured-table " + tableWidthClass(columns.length);\n                var header = table.createTHead().insertRow(); columns.forEach(function (column) { var cell = document.createElement("th"); cell.className = tableColumnClass(column); cell.textContent = column; header.appendChild(cell); });\n                var body = table.createTBody(); visible.forEach(function (source) { var row = body.insertRow(); columns.forEach(function (column) { var cell = row.insertCell(); cell.className = tableColumnClass(column); appendValue(cell, source && source[column]); }); });',
              'structured Results table classes')

          replace_once(results,
              '                var wrapper = document.createElement("div"); wrapper.className = "mc-results-table-wrap";\n                var table = document.createElement("table"); table.className = "style1 mc-results-table mc-results-table-" + String(options.kind || "scripts"); wrapper.appendChild(table); tableHost.appendChild(wrapper);\n                var header = table.createTHead().insertRow(); columns.forEach(function (column) { var cell = document.createElement("th"); cell.textContent = column.title; header.appendChild(cell); });\n                if (options.showView !== false) { var viewHead = document.createElement("th"); viewHead.textContent = "View"; header.appendChild(viewHead); }\n                if (typeof options.actions === "function") { var actionHead = document.createElement("th"); actionHead.textContent = "Actions"; header.appendChild(actionHead); }',
              '                var wrapper = document.createElement("div"); wrapper.className = "mc-results-table-wrap";\n                var renderedColumnCount = columns.length + (options.showView !== false ? 1 : 0) + (typeof options.actions === "function" ? 1 : 0);\n                var table = document.createElement("table"); table.className = "style1 mc-results-table mc-results-table-" + String(options.kind || "scripts") + " " + tableWidthClass(renderedColumnCount); wrapper.appendChild(table); tableHost.appendChild(wrapper);\n                var header = table.createTHead().insertRow(); columns.forEach(function (column) { var cell = document.createElement("th"); cell.className = tableColumnClass(column.title); cell.textContent = column.title; header.appendChild(cell); });\n                if (options.showView !== false) { var viewHead = document.createElement("th"); viewHead.className = "mc-results-col-actions"; viewHead.textContent = "View"; header.appendChild(viewHead); }\n                if (typeof options.actions === "function") { var actionHead = document.createElement("th"); actionHead.className = "mc-results-col-actions"; actionHead.textContent = "Actions"; header.appendChild(actionHead); }',
              'standard Results table headers')

          replace_once(results,
              '''                    columns.forEach(function (column) {\n                        var cell = tableRow.insertCell();\n                        if (typeof column.render === "function") { column.render(cell, row); return; }\n                        var value = typeof column.value === "function" ? column.value(row) : valueAt(row, column.path, "—");\n                        cell.className = typeof column.className === "function" ? column.className(row) || "" : column.className || ""; appendValue(cell, value);\n                    });\n                    if (options.showView !== false) { var viewCell = tableRow.insertCell(), view = document.createElement("button"); view.type = "button"; view.className = "btn btn-primary btn-sm mc-results-view-button"; view.textContent = "View"; view.onclick = function () { openViewer(row, options); }; viewCell.appendChild(view); }\n                    if (typeof options.actions === "function") { var actionCell = tableRow.insertCell(); options.actions(actionCell, row); }''',
              '''                    columns.forEach(function (column) {\n                        var cell = tableRow.insertCell();\n                        cell.className = tableColumnClass(column.title);\n                        if (typeof column.render === "function") { column.render(cell, row); return; }\n                        var value = typeof column.value === "function" ? column.value(row) : valueAt(row, column.path, "—");\n                        var stateClass = typeof column.className === "function" ? column.className(row) || "" : column.className || "";\n                        if (stateClass) cell.className += " " + stateClass;\n                        appendValue(cell, value);\n                    });\n                    if (options.showView !== false) { var viewCell = tableRow.insertCell(), view = document.createElement("button"); viewCell.className = "mc-results-col-actions"; view.type = "button"; view.className = "btn btn-primary btn-sm mc-results-view-button"; view.textContent = "View"; view.onclick = function () { openViewer(row, options); }; viewCell.appendChild(view); }\n                    if (typeof options.actions === "function") { var actionCell = tableRow.insertCell(); actionCell.className = "mc-results-col-actions"; options.actions(actionCell, row); }''',
              'standard Results table cells')

          css = 'public/shared/ui/shared-ui.css'
          old_css = '.mc-results-title{margin:0 0 12px;font-size:18px}.mc-results-filter{display:block;width:min(420px,100%);box-sizing:border-box;margin:0 0 10px;padding:7px 9px}.mc-results-table-wrap{width:100%;overflow:auto}.mc-results-table{width:100%;border-collapse:collapse;table-layout:fixed}.mc-results-table th,.mc-results-table td{padding:8px;vertical-align:top;text-align:left}.mc-results-table th{white-space:nowrap}.mc-results-output{margin:0;min-width:260px;max-width:720px;max-height:120px;overflow:auto;white-space:pre-wrap;word-break:break-word;font-family:Consolas,monospace}.mc-results-status{font-weight:700;white-space:nowrap}.mc-results-view-button,.mc-results-copy-button{margin:0 5px 4px 0}'
          new_css = '.mc-results-title{margin:0 0 12px;font-size:18px}.mc-results-filter{display:block;width:min(420px,100%);box-sizing:border-box;margin:0 0 10px;padding:7px 9px}.mc-results-table-wrap{width:100%;overflow:auto}.mc-results-table{width:100%;min-width:620px;border-collapse:collapse;table-layout:auto}.mc-results-table.mc-results-table-medium{min-width:780px}.mc-results-table.mc-results-table-wide{min-width:1040px}.mc-results-table th,.mc-results-table td{padding:8px;vertical-align:top;text-align:left;white-space:normal;word-break:normal;overflow-wrap:normal}.mc-results-table th{white-space:nowrap}.mc-results-table .mc-results-col-short{min-width:105px;white-space:nowrap}.mc-results-table .mc-results-col-actions{min-width:120px;white-space:nowrap}.mc-results-table .mc-results-col-medium{min-width:150px;max-width:240px}.mc-results-table .mc-results-col-text{min-width:210px;width:280px;max-width:420px;white-space:normal;word-break:normal;overflow-wrap:normal}.mc-results-table .mc-results-col-default{min-width:130px;max-width:300px;white-space:normal;word-break:normal;overflow-wrap:normal}.mc-results-output{margin:0;min-width:260px;max-width:720px;max-height:120px;overflow:auto;white-space:pre-wrap;word-break:break-word;font-family:Consolas,monospace}.mc-results-status{font-weight:700;white-space:nowrap}.mc-results-view-button,.mc-results-copy-button{margin:0 5px 4px 0}'
          replace_once(css, old_css, new_css, 'Shared Results CSS geometry')
          replace_once(css, '.mc-results-structured-table{min-width:600px}', '.mc-results-structured-table{min-width:620px}', 'structured table baseline')
          PY
          cat > test/results-table-readability.test.js <<'EOF'
          "use strict";

          var assert = require("assert");
          var fs = require("fs");
          var path = require("path");
          var root = path.resolve(__dirname, "..");
          var results = fs.readFileSync(path.join(root, "public/shared/ui/results.js"), "utf8");
          var css = fs.readFileSync(path.join(root, "public/shared/ui/shared-ui.css"), "utf8");
          var approvals = fs.readFileSync(path.join(root, "public/modules/approvals/index.js"), "utf8");

          assert.ok(css.indexOf('.mc-results-table-wrap{width:100%;overflow:auto}') >= 0,
              "Shared Results wrapper must own horizontal overflow.");
          assert.ok(css.indexOf('.mc-results-table{width:100%;min-width:620px;border-collapse:collapse;table-layout:auto}') >= 0,
              "Shared Results tables must use readable auto layout with a baseline minimum.");
          assert.strictEqual(css.indexOf('table-layout:fixed'), -1,
              "Shared Results must not force fixed-layout column compression.");
          assert.ok(css.indexOf('.mc-results-table.mc-results-table-medium{min-width:780px}') >= 0 &&
              css.indexOf('.mc-results-table.mc-results-table-wide{min-width:1040px}') >= 0,
              "Column-count classes must increase the shared minimum width for wider tables.");
          assert.ok(results.indexOf('if (columnCount >= 7) return "mc-results-table-wide"') >= 0 &&
              results.indexOf('if (columnCount >= 4) return "mc-results-table-medium"') >= 0,
              "SharedResultsView must classify table width by rendered column count without DOM measurement.");
          assert.ok(results.indexOf('renderedColumnCount = columns.length + (options.showView !== false ? 1 : 0) + (typeof options.actions === "function" ? 1 : 0)') >= 0,
              "A 7-9 column fixture must include View/Actions in the width class decision.");
          assert.ok(results.indexOf('mc-results-structured-table " + tableWidthClass(columns.length)') >= 0,
              "Structured result tables must reuse the same count-based width contract.");

          ["datetime", "status", "approval"].forEach(function (title) {
              assert.ok(results.indexOf('key === "' + title + '"') >= 0,
                  "Short result column must have a stable semantic role: " + title);
          });
          ["request", "summary", "command", "script", "device", "result"].forEach(function (title) {
              assert.ok(results.indexOf('key === "' + title + '"') >= 0,
                  "Long result column must have a readable text role: " + title);
          });
          assert.ok(css.indexOf('.mc-results-table .mc-results-col-short{min-width:105px;white-space:nowrap}') >= 0,
              "DateTime/Status/Approval style columns must stay compact and unbroken.");
          assert.ok(css.indexOf('.mc-results-table .mc-results-col-text{min-width:210px;width:280px;max-width:420px;white-space:normal;word-break:normal;overflow-wrap:normal}') >= 0,
              "Request/Summary/Command/Script/Device text must wrap normally only after a readable minimum.");
          assert.strictEqual(/\.mc-results-table[^}]*word-break:break-all/.test(css), false,
              "Result tables must never break words character-by-character to avoid horizontal scrolling.");
          assert.ok(approvals.indexOf('{ title: "Request"') >= 0 && approvals.indexOf('{ title: "Summary"') >= 0 && approvals.indexOf('{ title: "Status"') >= 0,
              "Approval Center must continue using SharedResultsView columns consumed by the shared semantic width contract.");
          assert.strictEqual(results.indexOf('ResizeObserver'), -1,
              "Results readability must not add ResizeObserver autosizing.");
          assert.strictEqual(results.indexOf('getBoundingClientRect'), -1,
              "Results readability must not measure cells or tables at runtime.");

          console.log("Shared Results tables preserve readable columns and scroll horizontally instead of compressing: OK");
          EOF
          rm .github/workflows/validate-results-readability-149.yml
      - name: Targeted Results tests
        run: |
          node test/results-table-readability.test.js
          node test/results-view-button-variant.test.js
          node test/shared-catalog-direct-columns.test.js
          node test/approval-button-native-style.test.js
      - name: Run full test suite
        run: npm test
      - name: Check diff
        run: |
          git diff --check
          git status --short
      - name: Save verified fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: preserve shared results table readability"
          git push origin HEAD:issue-149-results-table-readability
