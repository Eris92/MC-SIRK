name: Apply pre-handoff native colors

on:
  push:
    branches:
      - refactor/pre-handoff-cleanup-1.8.20
    paths:
      - scripts/pre-handoff-native-colors.py
      - .github/workflows/pre-handoff-native-colors.yml

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/pre-handoff-cleanup-1.8.20
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply transform
        run: python scripts/pre-handoff-native-colors.py
      - name: Validate
        run: |
          grep -q 'var(--bs-warning,currentColor)' public/shared/ui/toolbar.css
          ! grep -q '#ffc107' public/shared/ui/toolbar.css
      - name: Remove one-shot tooling and commit
        run: |
          rm scripts/pre-handoff-native-colors.py
          rm .github/workflows/pre-handoff-native-colors.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Use native theme tokens for command icon colors"
          git push origin HEAD:refactor/pre-handoff-cleanup-1.8.20
