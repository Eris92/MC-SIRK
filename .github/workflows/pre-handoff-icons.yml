name: Apply pre-handoff icon cleanup

on:
  push:
    branches:
      - refactor/pre-handoff-cleanup-1.8.20
    paths:
      - scripts/pre-handoff-icons.py
      - .github/workflows/pre-handoff-icons.yml

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/pre-handoff-cleanup-1.8.20
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply transform
        run: python scripts/pre-handoff-icons.py
      - name: Validate transformed sources
        run: |
          node --check public/modules/commands/index.js
          node --check public/shared/core.js
          grep -q "network-settings" public/modules/commands/index.js
          grep -q "SirkIconMode.useModern" public/shared/core.js
      - name: Remove one-shot tooling and commit
        run: |
          rm scripts/pre-handoff-icons.py
          rm .github/workflows/pre-handoff-icons.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finish Commands icon and icon-mode cleanup"
          git push origin HEAD:refactor/pre-handoff-cleanup-1.8.20
