name: Apply pre-handoff script-tools cleanup

on:
  push:
    branches:
      - refactor/pre-handoff-cleanup-1.8.20
    paths:
      - scripts/pre-handoff-script-tools.py
      - .github/workflows/pre-handoff-script-tools.yml

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/pre-handoff-cleanup-1.8.20
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply transform
        run: python scripts/pre-handoff-script-tools.py
      - name: Validate transformed sources
        run: |
          node --check public/shared/ui/script-tools.js
          node --check plugin-main.js
          node --check admin.js
          test ! -e public/shared/ui/script-definition-form.js
          test ! -e public/shared/ui/confirm-execution-form.js
          test ! -e public/shared/ui/script-edit-actions.js
          test ! -e public/shared/ui/system-credentials-form.js
          grep -q "confirmExecution: confirmExecution.checked" public/shared/ui/script-tools.js
          grep -q 'createSelect(\["0", "2"\]' public/shared/ui/script-tools.js
      - name: Remove one-shot tooling and commit
        run: |
          rm scripts/pre-handoff-script-tools.py
          rm .github/workflows/pre-handoff-script-tools.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Consolidate script tools and remove decorator layers"
          git push origin HEAD:refactor/pre-handoff-cleanup-1.8.20
