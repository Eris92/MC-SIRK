name: Apply UI state fix

on:
  push:
    branches:
      - fix/1.8.21-ui-state-and-edit-actions

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/1.8.21-ui-state-and-edit-actions
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply exact source patch
        run: python scripts/apply-ui-state-fix.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/shared/core.js public/shared/ui/script-tools.js public/shared/ui/tree.js public/shared/ui/toolbar.css test/
          git commit -m "Fix visible menu icons, Edit actions and selection state"
          git push origin HEAD:fix/1.8.21-ui-state-and-edit-actions
