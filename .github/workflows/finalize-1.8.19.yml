name: Finalize SIRK 1.8.19

on:
  push:
    branches:
      - fix/ui-admin-audit-1.8.19

permissions:
  contents: write

concurrency:
  group: finalize-sirk-1.8.19
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current branch head
        uses: actions/checkout@v4
        with:
          ref: fix/ui-admin-audit-1.8.19
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply atomic patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import zlib
          payload = Path('scripts/patches/apply-1.8.19.py.b64').read_text(encoding='utf-8').strip()
          Path('/tmp/apply-1.8.19.py').write_bytes(zlib.decompress(base64.b64decode(payload)))
          PY
          python /tmp/apply-1.8.19.py
      - name: Validate changed files
        shell: bash
        run: |
          git diff --check
          node --check web/admin/admin.js
          node --check server/core/audit-log.js
          node --check server/core/runtime.js
          node --check server/core/device-service.js
          node --check server/modules/commands/index.js
          node --check public/shared/runtime.js
          node --check public/shared/ui/page.js
          node --check public/shared/ui/status-nav.js
          node --check public/shared/ui/tree.js
          node --check public/modules/commands/index.js
          node --check public/native/desktop-commands.js
          node --check admin.js
      - name: Run full test suite
        run: npm test
      - name: Commit verified source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix UI admin actions and audit logging for 1.8.19"
          git push origin HEAD:fix/ui-admin-audit-1.8.19
