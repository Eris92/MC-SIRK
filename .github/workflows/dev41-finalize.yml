name: Dev41 Finalize
on:
  push:
    branches: [dev-41-elevated-network-admin-surface]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev-41-elevated-network-admin-surface
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Finalize metadata
        run: python3 .tmp/dev41_finalize.py
      - name: Remove temporary infrastructure before tests
        run: rm -f .tmp/dev41_finalize.py .github/workflows/dev41-finalize.yml
      - name: Validate exact version
        run: |
          node -e "const p=require('./package.json'),c=require('./config.json'); if(p.version!=='0.1.1-dev.41'||c.version!==p.version) process.exit(1); console.log(p.version)"
          node -e "const h=require('./version-history.json'); if(h[0].version!=='0.1.1-dev.41') process.exit(1)"
      - name: Full test
        run: npm test
      - name: Diff check
        run: git diff --check
      - name: Commit dev41 candidate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'chore: prepare 0.1.1-dev.41'
          git push origin HEAD:dev-41-elevated-network-admin-surface
